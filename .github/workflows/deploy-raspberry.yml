name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - migration/angular-fastapi
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate backend syntax
        run: python -m compileall -q backend/app

  deploy:
    name: Deploy on Raspberry Pi
    needs: validate
    runs-on: [self-hosted, linux, ARM64, raspberry-pi]
    environment: production
    steps:
      - name: Checkout deployment code
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Deploy latest version
        env:
          APP_DIR: /home/aman/figuras_ocultas
          DEPLOY_BRANCH: migration/angular-fastapi
        run: |
          test -f "${{ github.workspace }}/scripts/deploy-raspberry.sh"
          bash "${{ github.workspace }}/scripts/deploy-raspberry.sh"
