services:
  backend:
    build: ./backend
    container_name: figuras-ocultas-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-figuras_ocultas}
      SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://raspberryaman.tail055e51.ts.net}
    networks: [legacy_app]

  frontend:
    build: ./frontend
    container_name: figuras-ocultas-frontend
    restart: unless-stopped
    expose:
      - "8080"
    depends_on: [backend]
    networks: [legacy_app]

  caddy:
    image: caddy:2-alpine
    container_name: figuras-ocultas-caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [frontend]
    networks: [legacy_app]

networks:
  legacy_app:
    external: true
    name: figuras_ocultas_app-network
