<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">

<head>
    <title>Figuras Ocultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index_style.css?v=1}">
    <link rel="stylesheet" th:href="@{/css/alumnos.css?v=1}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body style="padding-top: 8rem;">

<div th:insert="~{fragments/navBar :: navBar}" th:with="currentPath='/alumnos'"></div>
<div th:insert="~{modalesAvisos/borradoAlumno :: modalConfirmarBorrado}"></div>
<div th:insert="~{modalesAvisos/errorTexto :: modalErrorGenerico}"></div>
<div th:insert="~{modalesAvisos/darElectronios :: modalConfirmarElectronios}"></div>

<!-- Contenido principal -->
<div class="mt-1 position-relative" style="width: 90%; margin: 0 auto;">
    <div th:if="${usuario}">
        <div th:if="${usuario.isAdmin()}">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0">Listado de Alumnos</h2>

                <div class="d-flex align-items-center gap-3">
                    <!-- Botón Electronios -->
                    <button id="btnElectronios" class="btn btn-primary fw-bold">
                        <img src="/images/electronio.png" alt="Electronio" style="width: 20px; height: 20px;">
                        Electronios
                    </button>

                    <button class="btn btn-success fw-bold" data-bs-toggle="modal" data-bs-target="#modalNuevoAlumno">
                        ➕ Nuevo Alumno
                    </button>

                    <form th:action="@{/alumnos}" method="get" class="d-flex align-items-center">
                        <select name="curso" class="form-select ms-2" onchange="this.form.submit()">
                            <option value="">&#128218; Todos los cursos</option>
                            <option value="PRIMERO_ESO" th:selected="${cursoSeleccionado} == 'PRIMERO_ESO'">1º ESO
                            </option>
                            <option value="SEGUNDO_ESO" th:selected="${cursoSeleccionado} == 'SEGUNDO_ESO'">2º ESO
                            </option>
                            <option value="TERCERO_ESO" th:selected="${cursoSeleccionado} == 'TERCERO_ESO'">3º ESO
                            </option>
                            <option value="CUARTO_ESO" th:selected="${cursoSeleccionado} == 'CUARTO_ESO'">4º ESO
                            </option>
                            <option value="PRIMERO_BACH" th:selected="${cursoSeleccionado} == 'PRIMERO_BACH'">1º BAC
                            </option>
                            <option value="SEGUNDO_BACH" th:selected="${cursoSeleccionado} == 'SEGUNDO_BACH'">2º BAC
                            </option>
                        </select>
                    </form>

                    <div th:replace="~{fragments/newAlumno :: newAlumno}"></div>
                </div>
            </div>

            <!-- CONTENEDOR FLEX HORIZONTAL -->
            <div class="d-flex w-100 align-items-start" style="min-width: 0;">

            <!-- FORMULARIO CON TABLA -->
                <form id="formElectronios" th:action="@{/alumnos/darElectronios}" method="post"
                      class="flex-grow-1 me-3" style="min-width: 0;">

                    <input type="hidden" id="cantidadElectroniosInput" name="cantidadElectronios" value="1"/>

                    <div class="table-responsive">
                        <table id="tablaAlumnos"
                               class="table table-striped w-100 text-center align-middle"
                               data-orden="asc">
                            <thead class="table-dark">
                            <tr>
                                <th id="colSeleccion" style="display:none;">Seleccionar</th>
                                <th class="sortable" data-col="1">Nombre <span class="flecha"></span></th>
                                <th class="sortable" data-col="2">Email <span class="flecha"></span></th>
                                <th class="sortable" data-col="3">Nivel <span class="flecha"></span></th>
                                <th class="sortable" data-col="4">Experiencia <span class="flecha"></span></th>
                                <th class="sortable" data-col="5">Electronios <span class="flecha"></span></th>
                                <th>Curso</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="alumno : ${alumnos}">
                                <td style="display:none;" class="col-seleccion">
                                    <input type="checkbox" class="form-check-input selector-checkbox"
                                           name="idsAlumnos" th:value="${alumno.id}">
                                </td>
                                <td th:text="${alumno.nombre}"></td>
                                <td th:text="${alumno.email}"></td>
                                <td th:text="${alumno.tarjetaAlumno.nivel}"></td>
                                <td th:text="${alumno.tarjetaAlumno.exp}"></td>
                                <td th:text="${alumno.tarjetaAlumno.electronios}"></td>
                                <td th:text="${alumno.curso}"></td>
                                <td>
                                    <div class="d-flex justify-content-center align-items-center gap-2">
                                        <a class="btn btn-sm btn-warning" style="background-color: deepskyblue;" th:href="@{/alumnos/insignias/{id}(id=${alumno.id})}">🎖️</a>
                                        <button type="button" class="btn btn-sm btn-warning btn-editar" th:data-email="${alumno.email}">✏️</button>
                                        <button type="button" class="btn btn-sm btn-danger btn-confirmar-borrado"
                                                th:data-id="${alumno.id}" th:data-nombre="${alumno.nombre}">🗑️</button>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </form>

                <!-- PANEL DERECHO -->
                <div id="panelElectronios" class="card p-3"
                     style="display: none; width: 300px; flex-shrink: 0; align-self: flex-start;">
                    <h5 class="mb-3">⚙️ Dar Electronios</h5>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="opcionSeleccion" id="opCurso" value="curso" checked>
                        <label class="form-check-label" for="opCurso">Seleccionar por curso</label>
                    </div>

                    <select id="selectCursoElectronios" class="form-select" aria-label="Seleccionar curso">
                        <option value="PRIMERO_ESO">1º ESO</option>
                        <option value="SEGUNDO_ESO">2º ESO</option>
                        <option value="TERCERO_ESO">3º ESO</option>
                        <option value="CUARTO_ESO">4º ESO</option>
                        <option value="PRIMERO_BACH">1º BAC</option>
                        <option value="SEGUNDO_BACH">2º BAC</option>
                    </select>

                    <br/>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="opcionSeleccion" id="opManual" value="manual">
                        <label class="form-check-label" for="opManual">Selección simple</label>
                    </div>

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="opcionSeleccion" id="opTodos" value="todos">
                        <label class="form-check-label" for="opTodos">Seleccionar todos</label>
                    </div>

                    <div class="input-cantidad">
                        <label class="me-2 fw-bold mb-0">Electronios:</label>
                        <div class="d-flex align-items-center gap-2">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="cambiarCantidad(-1)">−</button>
                            <input type="number" id="cantidadElectronios" class="form-control" value="1" min="1">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="cambiarCantidad(1)">＋</button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success fw-bold mt-3 w-100" form="formElectronios">Aceptar</button>
                </div>
            </div>

        </div>
    </div>
</div>

<div id="modalContainer"></div>

<script>

    // -------- ORDENAR LA TABLA  ----------

    function ordenarTabla(colIndex) {
        const tabla = document.getElementById("tablaAlumnos");
        const tbody = tabla.tBodies[0];
        const filas = Array.from(tbody.rows);

        // Detectar el tipo de dato de la columna (número o texto)
        const esNumerico = filas.every(fila => {
            const valor = fila.cells[colIndex].textContent.trim();
            return !isNaN(valor) && valor !== "";
        });

        // Obtener la dirección actual de ordenación
        const ths = Array.from(tabla.querySelectorAll("th.sortable"));
        const th = ths.find(header => parseInt(header.getAttribute("data-col")) === colIndex);
        let ordenActual = th.getAttribute("data-orden") || "asc";

        // Si ya estaba ordenada ascendente, ahora descendente, y viceversa
        let nuevoOrden = (ordenActual === "asc") ? "desc" : "asc";

        // Quitar indicador de orden de todas las columnas
        ths.forEach(header => {
            header.setAttribute("data-orden", "");
            const flecha = header.querySelector(".flecha");
            if (flecha) flecha.textContent = "";
        });

        // Actualizar la columna que se ordena
        th.setAttribute("data-orden", nuevoOrden);
        const flecha = th.querySelector(".flecha");
        if (th) {
            th.setAttribute("data-orden", nuevoOrden);
            const flecha = th.querySelector(".flecha");
            if (flecha) flecha.textContent = (nuevoOrden === "asc") ? "▲" : "▼";
        }

        // Función para comparar dos valores según el tipo y orden
        const comparar = (a, b) => {
            let valA = a.cells[colIndex].textContent.trim();
            let valB = b.cells[colIndex].textContent.trim();

            if (esNumerico) {
                valA = parseFloat(valA);
                valB = parseFloat(valB);
            } else {
                valA = valA.toLowerCase();
                valB = valB.toLowerCase();
            }

            if (valA < valB) return (nuevoOrden === "asc") ? -1 : 1;
            if (valA > valB) return (nuevoOrden === "asc") ? 1 : -1;
            return 0;
        };

        // Ordenar las filas
        filas.sort(comparar);

        // Volver a añadir las filas ordenadas al tbody
        filas.forEach(fila => tbody.appendChild(fila));
    }

    // -------- ACTUALIZAR VISIBILIDAD DE SELECCIÓN SEGÚN RADIO ----------
    function actualizarVisibilidadSeleccion() {
        const opcionSeleccionada = document.querySelector('input[name="opcionSeleccion"]:checked');
        const colSeleccion = document.getElementById("colSeleccion");
        const columnas = document.querySelectorAll(".col-seleccion");

        const panelElectronios = document.getElementById("panelElectronios");
        const electroniosVisible = panelElectronios && panelElectronios.style.display !== "none";

        // Si el panel electronios NO está visible, ocultamos la columna siempre
        if (!electroniosVisible) {
            if (colSeleccion) colSeleccion.style.display = "none";
            columnas.forEach(col => col.style.display = "none");
            return;  // No hace falta más lógica
        }

        // Si el panel electronios está visible, aplicamos la lógica según radio seleccionado
        if (opcionSeleccionada && opcionSeleccionada.id === "opCurso") {
            if (colSeleccion) colSeleccion.style.display = "none";
            columnas.forEach(col => col.style.display = "none");
        } else {
            if (colSeleccion) colSeleccion.style.display = "";
            columnas.forEach(col => col.style.display = "");
        }
    }

    // --------- CONFIGURAR EVENTOS AL CARGAR LA PÁGINA ----------
    document.addEventListener("DOMContentLoaded", () => {

        // Ordenación por columnas
        document.querySelectorAll("th.sortable").forEach(th => {
            th.addEventListener("click", () => {
                ordenarTabla(parseInt(th.getAttribute("data-col")));
            });
        });

        // Radios de opción (selección de alumnos)
        const radios = document.querySelectorAll('input[name="opcionSeleccion"]');
        radios.forEach(radio => {
            radio.addEventListener("change", () => {
                actualizarVisibilidadSeleccion();

                const checkboxes = document.querySelectorAll("#tablaAlumnos tbody tr:not([style*='display: none']) .selector-checkbox");

                if (radio.id === "opTodos" && radio.checked) {
                    checkboxes.forEach(cb => {
                        cb.checked = true;
                        cb.closest("tr").classList.add("fila-seleccionada");
                    });
                } else if (radio.id === "opManual" && radio.checked) {
                    checkboxes.forEach(cb => {
                        cb.checked = false;
                        cb.closest("tr").classList.remove("fila-seleccionada");
                    });
                } else if (radio.id === "opCurso" && radio.checked) {
                    checkboxes.forEach(cb => {
                        cb.checked = false;
                        cb.closest("tr").classList.remove("fila-seleccionada");
                    });
                }
            });
        });

        // Aplicar visibilidad inicial
        actualizarVisibilidadSeleccion();

        // Botón editar (modal con datos del alumno)
        document.querySelectorAll(".btn-editar").forEach(btn => {
            btn.addEventListener("click", async () => {
                const email = btn.getAttribute("data-email");
                const response = await fetch(`/alumnos/info?email=${encodeURIComponent(email)}`);
                const html = await response.text();
                document.querySelector("#modalContainer").innerHTML = html;

                const toggle = document.getElementById('togglePasswordEditar');
                if (toggle) {
                    toggle.addEventListener('click', () => {
                        const input = document.getElementById("passwordEditar");
                        const icon = toggle.querySelector("i");
                        if (input.type === "password") {
                            input.type = "text";
                            icon.classList.remove("fa-eye-slash");
                            icon.classList.add("fa-eye");
                        } else {
                            input.type = "password";
                            icon.classList.remove("fa-eye");
                            icon.classList.add("fa-eye-slash");
                        }
                    });
                }

                const modal = new bootstrap.Modal(document.getElementById('modalEditarAlumno'));
                modal.show();
            });
        });

        // Checkbox fila seleccionada visualmente
        document.addEventListener('change', (e) => {
            if (e.target.classList.contains('selector-checkbox')) {
                const fila = e.target.closest('tr');
                fila.classList.toggle('fila-seleccionada', e.target.checked);
            }
        });

        // Botón Electronios (mostrar/ocultar panel)
        let electroniosActivo = false;
        document.getElementById("btnElectronios").addEventListener("click", () => {
            electroniosActivo = !electroniosActivo;
            const mostrar = electroniosActivo;
            document.getElementById("panelElectronios").style.display = mostrar ? "block" : "none";

            // Forzar que siempre se seleccione "curso"
            document.getElementById("opCurso").checked = true;

            // Actualizar visibilidad según la opción de radio y estado del panel
            actualizarVisibilidadSeleccion();

            if (!mostrar) {
                document.querySelectorAll(".selector-checkbox").forEach(cb => {
                    cb.checked = false;
                    cb.closest("tr").classList.remove("fila-seleccionada");
                });
            }
        });

        // Modal de confirmación de borrado
        document.querySelectorAll(".btn-confirmar-borrado").forEach(btn => {
            btn.addEventListener("click", () => {
                const id = btn.getAttribute("data-id");
                const nombre = btn.getAttribute("data-nombre");

                document.getElementById("nombreAlumnoAEliminar").textContent = nombre;
                const form = document.getElementById("formBorrarAlumno");
                form.setAttribute("action", `/alumnos/borrar/${id}`);

                const modal = new bootstrap.Modal(document.getElementById("modalConfirmarBorrado"));
                modal.show();
            });
        });
    });

    // ------- CAMBIAR CANTIDAD DE ELECTRONIOS -------
    function cambiarCantidad(cambio) {
        const input = document.getElementById("cantidadElectronios");
        let valor = parseInt(input.value) || 0;
        valor += cambio;
        input.value = valor;
    }

    document.getElementById('formElectronios').addEventListener('submit', function(event) {
        const cantidadVisible = document.getElementById('cantidadElectronios').value;
        document.getElementById('cantidadElectroniosInput').value = cantidadVisible;
    });

    let formDataElectronios = null; // Variable global para el form data

    document.getElementById("formElectronios").addEventListener("submit", function (event) {
        event.preventDefault();

        const form = event.target;
        const formData = new FormData(form);
        formDataElectronios = null; // Reiniciar

        const tipoSeleccion = document.querySelector('input[name="opcionSeleccion"]:checked').value;
        formData.append("tipoSeleccion", tipoSeleccion);

        const cantidad = document.getElementById("cantidadElectronios").value;

        let textoDestinatarios = "";

        if (tipoSeleccion === "curso") {
            const curso = document.getElementById("selectCursoElectronios").value;
            if (!curso) {
                mostrarError("Debes seleccionar un curso válido.");
                return;
            }
            formData.append("curso", curso);
            textoDestinatarios = curso;
        } else {
            const checkboxes = document.querySelectorAll('.selector-checkbox:checked');
            if (checkboxes.length === 0) {
                mostrarError("Debes seleccionar al menos un alumno.");
                return;
            }
            textoDestinatarios = `${checkboxes.length} alumno${checkboxes.length > 1 ? 's' : ''}`;
            checkboxes.forEach(cb => {
                formData.append("idsAlumnos", cb.value);
            });
        }

        formDataElectronios = formData;

        // Actualizar texto modal
        document.getElementById("cantidadElectroniosModal").textContent = cantidad;
        document.getElementById("destinatariosModal").textContent = textoDestinatarios;

        // Mostrar modal
        const modalConfirm = new bootstrap.Modal(document.getElementById("modalConfirmarElectronios"));
        modalConfirm.show();
    });

    document.getElementById("btnAceptarConfirmacion").addEventListener("click", function () {
        if (!formDataElectronios) return;

        fetch("/alumnos/darElectronios", { // Cambia la URL si necesitas
            method: "POST",
            body: formDataElectronios
        })
            .then(response => {
                if (response.redirected) {
                    window.location.href = response.url;
                } else if (response.ok) {
                    return response.text();
                } else {
                    throw new Error("Error al enviar el formulario");
                }
            })
            .then(data => {
                console.log("Electronios enviados correctamente");
                // Opcional: cerrar modal manualmente si quieres
                const modal = bootstrap.Modal.getInstance(document.getElementById("modalConfirmarElectronios"));
                modal.hide();
            })
            .catch(error => {
                console.error("Error:", error);
            });
    });

    function mostrarError(mensaje) {
        document.getElementById("textoErrorModal").textContent = mensaje;
        const modal = new bootstrap.Modal(document.getElementById("modalErrorGenerico"));
        modal.show();
    }

</script>

</body>
</html>
