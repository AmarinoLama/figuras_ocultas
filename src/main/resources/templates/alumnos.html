<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Figuras Ocultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index_style.css?v=1}">
    <link rel="stylesheet" th:href="@{/css/modal_form_style.css?v=1}">
</head>

<body>

<div th:insert="~{fragments/navBar :: navBar}" th:with="currentPath='/alumnos'"></div>

<!-- Contenido principal -->
<div class="container mt-5 pt-4">
    <div th:if="${usuario}">
        <div th:if="${usuario.isAdmin()}">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0">Listado de Alumnos</h2>

                <div class="d-flex align-items-center gap-3">
                    <form th:action="@{/alumnos}" method="get" class="d-flex align-items-center">
                        <select name="curso" class="form-select me-2" onchange="this.form.submit()">
                            <option value="">📚 Todos los cursos</option>
                            <option value="PRIMERO_ESO" th:selected="${cursoSeleccionado} == 'PRIMERO_ESO'">1º ESO</option>
                            <option value="SEGUNDO_ESO" th:selected="${cursoSeleccionado} == 'SEGUNDO_ESO'">2º ESO</option>
                            <option value="TERCERO_ESO" th:selected="${cursoSeleccionado} == 'TERCERO_ESO'">3º ESO</option>
                            <option value="CUARTO_ESO" th:selected="${cursoSeleccionado} == 'CUARTO_ESO'">4º ESO</option>
                            <option value="PRIMERO_BACH" th:selected="${cursoSeleccionado} == 'PRIMERO_BACH'">1º BAC</option>
                            <option value="SEGUNDO_BACH" th:selected="${cursoSeleccionado} == 'SEGUNDO_BACH'">2º BAC</option>
                        </select>
                    </form>

                    <button class="btn btn-success fw-bold" data-bs-toggle="modal" data-bs-target="#modalNuevoAlumno">
                        ➕ Nuevo Alumno
                    </button>

                    <div th:replace="~{fragments/newAlumno :: newAlumno}"></div>
                </div>
            </div>

            <table id="tablaAlumnos" data-orden="asc" class="table table-bordered table-hover table-striped text-center align-middle">
                <thead class="table-dark">
                <tr>
                    <th onclick="ordenarTabla(0)" style="cursor:pointer;">Nombre ⬍</th>
                    <th onclick="ordenarTabla(1)" style="cursor:pointer;">Email ⬍</th>
                    <th onclick="ordenarTabla(2)" style="cursor:pointer;">Nivel ⬍</th>
                    <th onclick="ordenarTabla(3)" style="cursor:pointer;">Experiencia ⬍</th>
                    <th onclick="ordenarTabla(4)" style="cursor:pointer;">Electronios ⬍</th>
                    <th style="cursor:pointer;">Curso</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="alumno : ${alumnos}">
                    <td th:text="${alumno.nombre}"></td>
                    <td th:text="${alumno.email}"></td>
                    <td th:text="${alumno.tarjetaAlumno.nivel}"></td>
                    <td th:text="${alumno.tarjetaAlumno.exp}"></td>
                    <td th:text="${alumno.tarjetaAlumno.electronios}"></td>
                    <td th:text="${alumno.curso}"></td>
                    <td>
                        <div class="d-flex justify-content-center align-items-center gap-2">

                            <button class="btn btn-sm btn-warning" data-bs-toggle="modal" data-bs-target="#modalEditarAlumno">
                                ✏️
                            </button>
                            <div th:replace="~{fragments/editAlumno :: editAlumno}"></div>

                            <form th:action="@{'/alumnos/borrar/' + ${alumno.id}}" method="post" style="margin:0;">
                                <button type="submit" class="btn btn-sm btn-danger"
                                        onclick="return confirm('¿Seguro que quieres borrar este alumno?');">🗑️</button>
                            </form>

                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Script para ordenación -->
<script>
    function ordenarTabla(colIndex) {
        const tabla = document.getElementById("tablaAlumnos");
        let orden = tabla.getAttribute("data-orden") === "asc" ? "desc" : "asc";
        tabla.setAttribute("data-orden", orden);

        const filas = Array.from(tabla.querySelectorAll("tbody tr"));
        filas.sort((a, b) => {
            let valA = a.children[colIndex].innerText.trim().toLowerCase();
            let valB = b.children[colIndex].innerText.trim().toLowerCase();

            // Si es numérico, comparamos como número
            if (!isNaN(valA) && !isNaN(valB)) {
                valA = parseFloat(valA);
                valB = parseFloat(valB);
                return orden === "asc" ? valA - valB : valB - valA;
            }

            return orden === "asc" ? valA.localeCompare(valB) : valB.localeCompare(valA);
        });

        const tbody = tabla.querySelector("tbody");
        filas.forEach(fila => tbody.appendChild(fila));
    }
</script>

</body>
</html>
