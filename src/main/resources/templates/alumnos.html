<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Figuras Ocultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index_style.css?v=1}">
    <link rel="stylesheet" th:href="@{/css/modal_form_style.css?v=1}">
</head>

<body>

<div th:insert="~{fragments/navBar :: navBar}"></div>

<!-- Contenido principal -->
<div class="container mt-5 pt-4">
    <div th:if="${usuario}">
        <div th:if="${usuario.isAdmin()}">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0">Listado de Alumnos</h2>

                <div class="d-flex align-items-center gap-3">
                    <form th:action="@{/alumnos}" method="get" class="d-flex align-items-center">
                        <select name="curso" class="form-select me-2" onchange="this.form.submit()">
                            <option value="">📚 Todos los cursos</option>
                            <option value="PRIMERO_ESO">1º ESO</option>
                            <option value="SEGUNDO_ESO">2º ESO</option>
                            <option value="TERCERO_ESO">3º ESO</option>
                            <option value="CUARTO_ESO">4º ESO</option>
                            <option value="PRIMERO_BACH">1º BAC</option>
                            <option value="SEGUNDO_BACH">2º BAC</option>
                        </select>
                    </form>

                    <button class="btn btn-success fw-bold" data-bs-toggle="modal" data-bs-target="#modalNuevoAlumno">
                        ➕ Nuevo Alumno
                    </button>

                    <div th:replace="~{fragments/newAlumno :: newAlumno}"></div>

                </div>
            </div>

            <table class="table table-bordered table-hover table-striped text-center align-middle">
                <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Nivel</th>
                    <th>Experiencia</th>
                    <th>Electronios</th>
                    <th>Curso</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="alumno : ${alumnos}">
                    <td th:text="${alumno.nombre}"></td>
                    <td th:text="${alumno.email}"></td>
                    <td th:text="${alumno.tarjetaAlumno.nivel}"></td>
                    <td th:text="${alumno.tarjetaAlumno.exp}"></td>
                    <td th:text="${alumno.tarjetaAlumno.electronios}"></td>
                    <td th:text="${alumno.curso}"></td>
                    <td>
                        <a class="btn btn-sm btn-warning me-2" th:href="@{'/alumnos/editar/' + ${alumno.id}}"
                           title="Modificar">✏️</a>
                        <a class="btn btn-sm btn-danger" th:href="@{'/alumnos/borrar/' + ${alumno.id}}" title="Borrar"
                           onclick="return confirm('¿Seguro que quieres borrar este alumno?');">🗑️</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
