<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">

<head>
    <title>Figuras Ocultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index_style.css?v=1}">
    <link rel="stylesheet" th:href="@{/css/modal_form_style.css?v=1}">
    <link rel="stylesheet" th:href="@{/css/alumnos.css?v=1}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div th:insert="~{fragments/navBar :: navBar}" th:with="currentPath='/alumnos'"></div>

<!-- Contenido principal -->
<div class="mt-5 pt-4 position-relative" style="width: 90%; margin: 0 auto;">
    <div th:if="${usuario}">
        <div th:if="${usuario.isAdmin()}">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0">Listado de Alumnos</h2>

                <div class="d-flex align-items-center gap-3">
                    <!-- Botón Electronios -->
                    <button id="btnElectronios" class="btn btn-primary fw-bold">&#9889; Electronios</button>

                    <button class="btn btn-success fw-bold" data-bs-toggle="modal" data-bs-target="#modalNuevoAlumno">
                        ➕ Nuevo Alumno
                    </button>

                    <form th:action="@{/alumnos}" method="get" class="d-flex align-items-center">
                        <select name="curso" class="form-select ms-2" onchange="this.form.submit()">
                            <option value="">&#128218; Todos los cursos</option>
                            <option value="PRIMERO_ESO" th:selected="${cursoSeleccionado} == 'PRIMERO_ESO'">1º ESO</option>
                            <option value="SEGUNDO_ESO" th:selected="${cursoSeleccionado} == 'SEGUNDO_ESO'">2º ESO</option>
                            <option value="TERCERO_ESO" th:selected="${cursoSeleccionado} == 'TERCERO_ESO'">3º ESO</option>
                            <option value="CUARTO_ESO" th:selected="${cursoSeleccionado} == 'CUARTO_ESO'">4º ESO</option>
                            <option value="PRIMERO_BACH" th:selected="${cursoSeleccionado} == 'PRIMERO_BACH'">1º BAC</option>
                            <option value="SEGUNDO_BACH" th:selected="${cursoSeleccionado} == 'SEGUNDO_BACH'">2º BAC</option>
                        </select>
                    </form>

                    <div th:replace="~{fragments/newAlumno :: newAlumno}"></div>
                </div>
            </div>

            <div class="d-flex flex-row align-items-start w-100">

                <table id="tablaAlumnos" class="table table-bordered table-hover table-striped text-center align-middle flex-grow-1 me-3" data-orden="asc">
                <thead class="table-dark">
                    <tr>
                        <th id="colSeleccion" style="display:none;">Seleccionar</th>
                        <th onclick="ordenarTabla(0)" style="cursor:pointer;">Nombre ⬍</th>
                        <th onclick="ordenarTabla(1)" style="cursor:pointer;">Email ⬍</th>
                        <th onclick="ordenarTabla(2)" style="cursor:pointer;">Nivel ⬍</th>
                        <th onclick="ordenarTabla(3)" style="cursor:pointer;">Experiencia ⬍</th>
                        <th onclick="ordenarTabla(4)" style="cursor:pointer;">Electronios ⬍</th>
                        <th>Curso</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="alumno : ${alumnos}">
                        <td style="display:none;" class="col-seleccion">
                            <input type="checkbox" class="form-check-input selector-checkbox">
                        </td>
                        <td th:text="${alumno.nombre}"></td>
                        <td th:text="${alumno.email}"></td>
                        <td th:text="${alumno.tarjetaAlumno.nivel}"></td>
                        <td th:text="${alumno.tarjetaAlumno.exp}"></td>
                        <td th:text="${alumno.tarjetaAlumno.electronios}"></td>
                        <td th:text="${alumno.curso}"></td>
                        <td>
                            <div class="d-flex justify-content-center align-items-center gap-2">
                                <button class="btn btn-sm btn-warning btn-editar" th:data-email="${alumno.email}">✏️</button>
                                <form th:action="@{'/alumnos/borrar/' + ${alumno.id}}" method="post" style="margin:0;">
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('¿Seguro que quieres borrar este alumno?');">🗑️</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <!-- Mini panel a la derecha -->
                <div id="panelElectronios" class="card p-3" style="display:none;">
                    <h5 class="mb-3">⚙️ Dar Electronios</h5>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="opcionSeleccion" id="opCurso" value="curso" checked>
                        <label class="form-check-label" for="opCurso">Seleccionar por curso</label>
                    </div>

                    <!-- Combobox de cursos para opción curso -->
                    <select id="selectCursoElectronios" class="form-select" aria-label="Seleccionar curso" checked>
                        <option value="">Seleccione un curso</option>
                        <option value="PRIMERO_ESO">1º ESO</option>
                        <option value="SEGUNDO_ESO">2º ESO</option>
                        <option value="TERCERO_ESO">3º ESO</option>
                        <option value="CUARTO_ESO">4º ESO</option>
                        <option value="PRIMERO_BACH">1º BAC</option>
                        <option value="SEGUNDO_BACH">2º BAC</option>
                    </select>

                    <br/>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="opcionSeleccion" id="opManual" value="manual">
                        <label class="form-check-label" for="opManual">Selección simple</label>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="radio" name="opcionSeleccion" id="opTodos" value="todos">
                        <label class="form-check-label" for="opTodos">Seleccionar todos</label>
                    </div>

                    <div class="input-cantidad">
                        <label class="me-2 fw-bold mb-0">Electronios:</label>
                        <div class="d-flex align-items-center gap-2">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="cambiarCantidad(-1)">−</button>
                            <input type="number" id="cantidadElectronios" class="form-control" value="1" min="1">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="cambiarCantidad(1)">＋</button>
                        </div>
                    </div>

                    <button type="button" class="btn btn-success fw-bold">Aceptar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="modalContainer"></div>

<script>
    function ordenarTabla(colIndex) {
        const tabla = document.getElementById("tablaAlumnos");
        let orden = tabla.getAttribute("data-orden") === "asc" ? "desc" : "asc";
        tabla.setAttribute("data-orden", orden);

        const filas = Array.from(tabla.querySelectorAll("tbody tr"));
        filas.sort((a, b) => {
            let valA = a.children[colIndex].innerText.trim().toLowerCase();
            let valB = b.children[colIndex].innerText.trim().toLowerCase();
            if (!isNaN(valA) && !isNaN(valB)) {
                valA = parseFloat(valA);
                valB = parseFloat(valB);
                return orden === "asc" ? valA - valB : valB - valA;
            }
            return orden === "asc" ? valA.localeCompare(valB) : valB.localeCompare(valA);
        });

        const tbody = tabla.querySelector("tbody");
        filas.forEach(fila => tbody.appendChild(fila));
    }

    document.addEventListener("DOMContentLoaded", () => {

        const radios = document.querySelectorAll('input[name="opcionSeleccion"]');
        radios.forEach(radio => {
            radio.addEventListener("change", () => {
                const checkboxes = document.querySelectorAll("#tablaAlumnos tbody tr:not([style*='display: none']) .selector-checkbox");

                if (radio.id === "opTodos" && radio.checked) {
                    // Seleccionar todos los checkboxes visibles
                    checkboxes.forEach(cb => {
                        cb.checked = true;
                        cb.closest("tr").classList.add("fila-seleccionada");
                    });
                } else if (radio.id === "opManual" && radio.checked) {
                    // Deseleccionar todos los checkboxes visibles
                    checkboxes.forEach(cb => {
                        cb.checked = false;
                        cb.closest("tr").classList.remove("fila-seleccionada");
                    });
                }
            });
        });
    });


    document.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll(".btn-editar").forEach(btn => {
            btn.addEventListener("click", async () => {
                const email = btn.getAttribute("data-email");
                const response = await fetch(`/alumnos/info?email=${encodeURIComponent(email)}`);
                const html = await response.text();
                document.querySelector("#modalContainer").innerHTML = html;
                const modal = new bootstrap.Modal(document.getElementById('modalEditarAlumno'));
                modal.show();
            });
        });

        document.addEventListener('change', (e) => {
            if (e.target.classList.contains('selector-checkbox')) {
                const fila = e.target.closest('tr');
                fila.classList.toggle('fila-seleccionada', e.target.checked);
            }
        });

        let electroniosActivo = false;
        document.getElementById("btnElectronios").addEventListener("click", () => {
            electroniosActivo = !electroniosActivo;
            const mostrar = electroniosActivo;
            document.getElementById("panelElectronios").style.display = mostrar ? "block" : "none";
            document.getElementById("colSeleccion").style.display = mostrar ? "" : "none";
            document.querySelectorAll(".col-seleccion").forEach(col => col.style.display = mostrar ? "" : "none");
            if (!mostrar) {
                document.querySelectorAll(".selector-checkbox").forEach(cb => {
                    cb.checked = false;
                    cb.closest("tr").classList.remove("fila-seleccionada");
                });
            }
        });
    });

    function cambiarCantidad(cambio) {
        const input = document.getElementById("cantidadElectronios");
        let valor = parseInt(input.value) || 0;
        valor += cambio;
        input.value = valor;
    }
</script>

</body>
</html>
