<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${nombreWeb}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index_style.css?v=1}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="pt-5">

<div th:insert="~{fragments/navBar :: navBar}" th:with="currentPath='/cartas'"></div>

<div class="container mt-5 pt-4">

    <div th:if="${mensajeCompra}" class="alert alert-dismissible fade show mt-3"
         th:classappend="'alert-' + ${tipoAlerta}" role="alert">
        <span th:text="${mensajeCompra}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div th:if="${usuario}">

        <!-- SI EL USUARIO ES UN ADMINISTRADOR -->

        <div th:if="${usuario.isAdmin()}">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0">Listado de Cartas</h2>

                <div class="d-flex align-items-center gap-3">

                    <button class="btn btn-success fw-bold" data-bs-toggle="modal" data-bs-target="#modalNuevaCarta">
                        ➕ Nueva Carta
                    </button>

                    <div th:replace="~{fragments/newCarta :: newCarta}"></div>

                </div>
            </div>

            <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
                <div th:each="carta : ${cartas}" class="col">
                    <div class="card shadow-sm p-2">
                        <div class="d-flex justify-content-center">
                            <!-- Imagen centrada -->
                            <img th:src="@{'/cartas/imagen/' + ${carta.id}}"
                                 class="card-img-top w-75"
                                 alt="Imagen de la carta">
                            <!-- Botones de acción al lado derecho de la imagen -->
                            <div class="d-flex flex-column justify-content-start ms-2">

                                <!-- Botón de editar cartas -->
                                <button class="btn btn-sm btn-warning btn-editar-carta" th:data-id="${carta.id}">✏️</button>

                                <!-- Botón para borrar cartas -->
                                <form th:action="@{'/cartas/borrar/' + ${carta.id}}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('¿Seguro que quieres borrar esta carta?');">🗑️</button>
                                </form>

                                <!-- Botón para alternar visibilidad -->
                                <form th:action="@{'/cartas/alternarVisibilidad/' + ${carta.id}}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-secondary btn-sm mt-1" title="Alternar visibilidad">
                                        <span th:if="${carta.activa}" class="bi bi-eye-fill">👁️</span>
                                        <span th:if="${!carta.activa}" class="bi bi-eye-slash-fill">🙈</span>
                                    </button>
                                </form>

                            </div>
                        </div>
                        <div class="card-body p-2">
                            <div class="d-flex justify-content-between">
                                <h5 class="card-title mb-1" th:text="${carta.titulo}">Título de la carta</h5>
                                <p class="card-text mb-1"><strong><span th:text="${carta.precio}">Precio</span> electronios</strong></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SI EL USUARIO ES UN ALUMNO -->

        <div th:if="${!usuario.isAdmin()}">

            <div class="mb-4 p-3 bg-light rounded shadow-sm text-center" style="font-size: 1.5rem; font-weight: bold; color: #6f42c1;">
                ⚡ Electronios disponibles: <span th:text="${electroniosTotales}">0</span>
            </div>

            <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
                <div th:each="carta : ${cartas}" class="col">
                    <div class="card text-dark border-0 shadow-sm"
                         style="background-color: #e6a5e8; border-radius: 20px; position: relative; overflow: hidden;">

                        <!-- Título + Inventario -->
                        <div class="d-flex justify-content-between align-items-start p-3">
                            <h5 class="card-title fw-bold mb-0"
                                th:text="${carta.titulo}"
                                style="font-size: 1.2rem; line-height: 1.2; max-width: 70%; word-wrap: break-word; white-space: normal;">
                                Nombre de la carta
                            </h5>

                            <div class="bg-light text-dark rounded px-2 py-1 d-flex align-items-center"
                                 style="font-weight: bold; font-size: 1rem; box-shadow: 0 0 6px rgba(0,0,0,0.1); user-select: none;">
                                🎒 <span th:text="${inventario[carta.id]} ?: 0">0</span>
                            </div>
                        </div>

                        <!-- Imagen centrada -->
                        <div class="d-flex justify-content-center p-3 pt-0">
                            <img th:src="@{'/cartas/imagen/' + ${carta.id}}"
                                 class="img-fluid rounded border border-3"
                                 style="max-height: 160px; border-color: #bbaaff;"
                                 alt="Imagen de la carta">
                        </div>

                        <!-- Botones e info abajo -->
                        <div class="d-flex justify-content-between align-items-center px-3 pb-3">
                            <div class="d-flex gap-2">
                                <form th:action="@{'/cartas/comprar/' + ${carta.id}}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm btn-light fw-bold"
                                            onclick="return confirm('¿Seguro que quieres comprar esta carta?');"
                                            title="Comprar">💰</button>
                                </form>

                                <button class="btn btn-sm btn-outline-dark btn-info-carta fw-bold"
                                        th:data-id="${carta.id}" title="Info">
                                    ℹ️
                                </button>
                            </div>

                            <p class="mb-0 fw-bold" style="font-size: 1rem;">
                                <span th:text="${carta.precio}">0</span> ⚡
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Modal para editar carta -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const botones = document.querySelectorAll(".btn-editar-carta");
        const container = document.querySelector("#modalContainerEdit");

        botones.forEach(btn => {
            btn.addEventListener("click", async () => {
                const id = btn.getAttribute("data-id");

                const response = await fetch(`/cartas/info?id=${encodeURIComponent(id)}`);
                const html = await response.text();

                container.innerHTML = html;

                // Bootstrap necesita esto si lo haces por JS manual
                const modal = new bootstrap.Modal(document.getElementById('modalEditarCarta'));
                modal.show();
            });
        });
    });
</script>

<!-- Modal para info carta -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const botones = document.querySelectorAll(".btn-info-carta");
        const container = document.querySelector("#modalContainerInfo");

        botones.forEach(btn => {
            btn.addEventListener("click", async () => {
                const id = btn.getAttribute("data-id");

                const response = await fetch(`/cartas/info?id=${encodeURIComponent(id)}`);
                const html = await response.text();

                container.innerHTML = html;

                // Bootstrap necesita esto si lo haces por JS manual
                const modal = new bootstrap.Modal(document.getElementById('modalInfoCarta'));
                modal.show();
            });
        });
    });
</script>

<div id="modalContainerEdit"></div>
<div id="modalContainerInfo"></div>

</body>
</html>
