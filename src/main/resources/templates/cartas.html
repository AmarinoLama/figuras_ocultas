<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${nombreWeb}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index_style.css?v=1}">
    <link rel="stylesheet" th:href="@{/css/cartas.css?v=3}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="pt-5">

<div th:insert="~{fragments/navBar :: navBar}" th:with="currentPath='/cartas'"></div>
<div th:insert="~{modalesAvisos/borrarCarta :: modalConfirmarBorradoCarta}"></div>
<div th:insert="~{modalesAvisos/comprarCarta :: modalConfirmarComprarCarta}"></div>

<div class="container mt-5 pt-4">

    <div th:if="${mensajeCompra}" class="alert alert-dismissible fade show mt-3"
         th:classappend="'alert-' + ${tipoAlerta}" role="alert">
        <span th:text="${mensajeCompra}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div th:if="${usuario}">

        <!-- SI EL USUARIO ES UN ADMINISTRADOR -->

        <div th:if="${usuario.isAdmin()}">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="mb-0" style="color: white !important;">Listado de Cartas</h2>

                <div class="d-flex align-items-center gap-3">

                    <button class="btn btn-success fw-bold" data-bs-toggle="modal" data-bs-target="#modalNuevaCarta">
                        ➕ Nueva Carta
                    </button>

                    <div th:replace="~{fragments/newCarta :: newCarta}"></div>

                </div>
            </div>

            <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
                <div th:each="carta : ${cartas}" class="col">
                    <div class="card shadow-sm p-0">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${carta.titulo}">Título</h5>
                            <img th:src="@{'/cartas/imagen/' + ${carta.id}}"
                                 class="card-img-top"
                                 alt="Imagen de la carta">
                            <p class="card-text">
                                <strong>
                                    <span th:text="${carta.precio}">Precio</span>
                                    <img src="/images/electronio.png" alt="Electronio" style="width: 20px; height: 20px;">
                                </strong>
                            </p>
                        </div>
                        <div class="card-footer">
                            <button class="btn btn-warning btn-editar-carta" th:data-id="${carta.id}" title="Editar">✏️</button>
                            <button type="button" class="btn btn-danger btn-confirmar-borrado-carta"
                                    th:attr="data-id=${carta.id}, data-nombre=${carta.titulo}" title="Borrar">🗑️</button>
                            <form th:action="@{'/cartas/alternarVisibilidad/' + ${carta.id}}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-secondary" title="Alternar visibilidad">
                                    <span th:if="${carta.activa}">👁️</span>
                                    <span th:if="${!carta.activa}">🙈</span>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SI EL USUARIO ES UN ALUMNO -->

        <div th:if="${!usuario.isAdmin()}">

            <div class="mb-4 p-3 bg-light rounded shadow-sm text-center" style="font-size: 1.5rem; font-weight: bold; color: #6f42c1;">
                <img src="/images/electronio.png" alt="Electronio" style="width: 20px; height: 20px; margin-left: 4px;"> Electronios disponibles: <span th:text="${electroniosTotales}">0</span>
            </div>

            <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
                <div th:each="carta : ${cartas}" class="col">
                    <div class="card shadow-sm p-0">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${carta.titulo}">Título</h5>
                            <img th:src="@{'/cartas/imagen/' + ${carta.id}}"
                                 class="card-img-top"
                                 alt="Imagen de la carta">
                            <p class="card-text d-flex justify-content-between align-items-center">
                                <strong>
                                    <span th:text="${carta.precio}">Precio</span>
                                    <img src="/images/electronio.png" alt="Electronio" style="width: 20px; height: 20px;">
                                </strong>
                                <span class="badge bg-primary">
                            🎒 <span th:text="${inventario[carta.id]} ?: 0">0</span>
                        </span>
                            </p>
                        </div>
                        <div class="card-footer d-flex justify-content-between">
                            <button type="button" class="btn btn-success btn-sm btn-confirmar-compra-carta fw-bold"
                                    th:attr="data-id=${carta.id}, data-nombre=${carta.titulo}" title="Comprar">
                                💰
                            </button>
                            <button class="btn btn-info btn-sm btn-info-carta fw-bold"
                                    th:data-id="${carta.id}" title="Info">
                                ℹ️
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Modal para editar carta -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const botones = document.querySelectorAll(".btn-editar-carta");
        const container = document.querySelector("#modalContainerEdit");

        botones.forEach(btn => {
            btn.addEventListener("click", async () => {
                const id = btn.getAttribute("data-id");

                const response = await fetch(`/cartas/info?id=${encodeURIComponent(id)}`);
                const html = await response.text();

                container.innerHTML = html;

                // Bootstrap necesita esto si lo haces por JS manual
                const modal = new bootstrap.Modal(document.getElementById('modalEditarCarta'));
                modal.show();
            });
        });
    });
</script>

<!-- Modal para info carta -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const botones = document.querySelectorAll(".btn-info-carta");
        const container = document.querySelector("#modalContainerInfo");

        botones.forEach(btn => {
            btn.addEventListener("click", async () => {
                const id = btn.getAttribute("data-id");

                const response = await fetch(`/cartas/info?id=${encodeURIComponent(id)}`);
                const html = await response.text();

                container.innerHTML = html;

                // Bootstrap necesita esto si lo haces por JS manual
                const modal = new bootstrap.Modal(document.getElementById('modalInfoCarta'));
                modal.show();
            });
        });
    });
</script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const botonesBorrar = document.querySelectorAll(".btn-confirmar-borrado-carta");
        const nombreSpan = document.getElementById("nombreCartaABorrar");
        const form = document.getElementById("formBorrarCarta");

        botonesBorrar.forEach(btn => {
            btn.addEventListener("click", () => {
                const id = btn.getAttribute("data-id");
                const nombre = btn.getAttribute("data-nombre");

                // Inserta el nombre en el modal
                nombreSpan.textContent = nombre;

                // Establece la acción del formulario con el ID de la carta
                form.action = `/cartas/borrar/${encodeURIComponent(id)}`;

                // Muestra el modal
                const modal = new bootstrap.Modal(document.getElementById("modalConfirmarBorradoCarta"));
                modal.show();
            });
        });
    });
</script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const botonesComprar = document.querySelectorAll(".btn-confirmar-compra-carta");
        const nombreSpan = document.getElementById("nombreCartaAComprar");
        const form = document.getElementById("formComprarCarta");

        botonesComprar.forEach(btn => {
            btn.addEventListener("click", () => {
                const id = btn.getAttribute("data-id");
                const nombre = btn.getAttribute("data-nombre");

                // Inserta el nombre en el modal
                nombreSpan.textContent = nombre;

                // Establece la acción del formulario con el ID de la carta
                form.action = `/cartas/comprar/${encodeURIComponent(id)}`;

                // Muestra el modal
                const modal = new bootstrap.Modal(document.getElementById("modalConfirmarComprarCarta"));
                modal.show();
            });
        });
    });
</script>


<div id="modalContainerEdit"></div>
<div id="modalContainerInfo"></div>

</body>
</html>
