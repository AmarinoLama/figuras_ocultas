<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Figuras Ocultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login_style.css?v=1}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
<section class="vh-100">
    <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col col-xl-10">
                <div class="card" style="border-radius: 1rem;">
                    <div class="row g-0">
                        <div class="col-md-6 col-lg-5 d-none d-md-block d-flex justify-content-center align-items-center">
                            <img alt="login form" class="img-fluid" src="/iconos/imgLogin.png"
                                 style="border-radius: 1rem 0 0 1rem; width: 100%; height: 100%; object-fit: cover;"/>
                        </div>
                        <div class="col-md-6 col-lg-7 d-flex align-items-center">
                            <div class="card-body p-4 p-lg-5 text-black">

                                <form method="post" th:action="@{/login}" th:object="${loginData}">
                                    <div class="mb-3 pb-1" style="color: #f1e6ff;">
                                        <span class="h1 fw-bold mb-0">Figuras Ocultas</span>
                                    </div>

                                    <h5 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;">Inicia sesión en tu
                                        cuenta</h5>

                                    <div class="form-outline mb-4" data-mdb-input-init>
                                        <input class="form-control form-control-lg" id="eMail" name="eMail"
                                               placeholder="Correo electrónico"
                                               required th:field="${loginData.email}" type="text"/>
                                        <label class="form-label" for="eMail">Correo electrónico</label>
                                    </div>

                                    <div class="form-outline mb-4 position-relative">
                                        <div class="input-group input-group-lg">
                                            <input type="password" class="form-control form-control-lg pe-5" id="password"
                                                   name="password"
                                                   placeholder="Contraseña" required th:field="${loginData.password}"/>
                                            <span class="input-group-text bg-transparent border-start-0 toggle-container"
                                                  id="togglePassword" onclick="togglePassword()"
                                                  title="Mostrar/Ocultar contraseña">
                                                <i class="fa-solid fa-eye"></i>
                                            </span>
                                        </div>
                                        <label class="form-label" for="password">Contraseña</label>
                                    </div>


                                    <div class="d-flex align-items-center mb-4 gap-3 flex-wrap">
                                        <button class="btn btn-dark btn-lg" data-mdb-button-init data-mdb-ripple-init type="submit">
                                            Iniciar sesión
                                        </button>

                                        <div class="alert alert-danger mb-0 py-2 px-3" style="white-space: nowrap;" th:if="${error != null}"
                                             th:text="${error}"></div>
                                    </div>

                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleIcon = document.querySelector("#togglePassword i");
        const isPassword = passwordInput.type === "password";

        passwordInput.type = isPassword ? "text" : "password";
        toggleIcon.classList.toggle("fa-eye");
        toggleIcon.classList.toggle("fa-eye-slash");
    }
</script>

</body>
</html>
