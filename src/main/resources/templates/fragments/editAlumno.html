<div th:fragment="editAlumno">
    <div th:if="${usuario.isAdmin()}">
        <div class="modal fade" id="modalEditarAlumno" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">Modificar Alumno</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <!-- Formulario, la acción se establece vía JS -->
                    <form method="post">
                        <div class="modal-body">
                            <!-- Nombre -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" required />
                            </div>

                            <!-- Curso -->
                            <div class="mb-3">
                                <label for="curso" class="form-label">Curso</label>
                                <select class="form-select" id="curso" name="curso" required>
                                    <option value="PRIMERO_ESO">1º ESO</option>
                                    <option value="SEGUNDO_ESO">2º ESO</option>
                                    <option value="TERCERO_ESO">3º ESO</option>
                                    <option value="CUARTO_ESO">4º ESO</option>
                                    <option value="PRIMERO_BACH">1º BACH</option>
                                    <option value="SEGUNDO_BACH">2º BACH</option>
                                </select>
                            </div>

                            <!-- Exp y Electronios -->
                            <div class="mb-3 d-flex justify-content-between gap-3">
                                <div class="flex-fill">
                                    <label for="exp" class="form-label">Exp</label>
                                    <input type="number" class="form-control" id="exp" name="exp" min="0" required />
                                </div>

                                <div class="flex-fill">
                                    <label for="electronios" class="form-label">Electronios</label>
                                    <input type="number" class="form-control" id="electronios" name="electronios" min="0" required />
                                </div>
                            </div>
                        </div>

                        <!-- Botones -->
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Actualizar Alumno</button>
                        </div>

                        <!-- Mostrar alerta si el email ya existe -->
                        <script th:if="${showAlert}">
                            alert('El email ya está en uso');
                            var myModal = new bootstrap.Modal(document.getElementById('modalEditarAlumno'), {
                                backdrop: 'static',
                                keyboard: false
                            });
                            myModal.show();
                        </script>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
