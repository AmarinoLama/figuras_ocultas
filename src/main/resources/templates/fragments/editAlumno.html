<div th:fragment="editAlumno">

    <div th:if="${usuario != null and usuario.isAdmin()}">
        <div class="modal fade" id="modalEditarAlumno" tabindex="-1" aria-labelledby="modalEditarAlumnoLabel"
             aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content shadow-lg border-0 rounded-4" style="background-color: #f3e8ff; color: #000;">
                    <div class="modal-header"
                         style="background-color: #8e44ad; color: #000; border-top-left-radius: 1rem; border-top-right-radius: 1rem;">
                        <h5 class="modal-title" id="modalEditarAlumnoLabel">
                            <i class="fas fa-user-edit me-2"></i>Modificar Alumno
                        </h5>
                        <button type="button" class="btn-close" style="filter: invert(1);" data-bs-dismiss="modal"
                                aria-label="Cerrar"></button>
                    </div>

                    <form th:action="@{'/alumnos/editar/' + ${alumno.id}}" method="post" class="">
                        <div class="modal-body py-4 px-5">

                            <!-- Nombre -->
                            <div class="mb-4">
                                <label for="nombre" class="form-label fw-semibold"><i class="fas fa-user me-2"></i>Nombre
                                    completo</label>
                                <input type="text" class="form-control form-control-lg rounded-3" id="nombre" name="nombre"
                                       th:value="${alumno.nombre}"
                                       placeholder="Introduce el nombre completo del alumno"/>
                            </div>

                            <!-- Email -->
                            <div class="mb-4">
                                <label for="email" class="form-label fw-semibold"><i class="fas fa-envelope me-2"></i>Email (nombre@algo)
                                    <div class="text-danger" th:if="${error != null}" th:text="${error}"></div>
                                </label>
                                <input type="email" class="form-control form-control-lg rounded-3" id="email" name="email"
                                       th:value="${alumno.email}" placeholder="correo@ejemplo.com"/>
                            </div>

                            <!-- Contraseña con ojo -->
                            <div class="mb-4 position-relative">
                                <label for="passwordEditar" class="form-label fw-semibold"><i
                                        class="fas fa-lock me-2"></i>Contraseña</label>
                                <div class="input-group input-group-lg">
                                    <input type="password" class="form-control form-control-lg rounded-3 pe-5" id="passwordEditar"
                                           name="password" th:value="${alumno.password}"
                                           placeholder="Contraseña segura..."/>
                                    <button type="button"
                                            class="input-group-text bg-transparent border-start-0 toggle-container"
                                            id="togglePasswordEditar" title="Mostrar/Ocultar contraseña">
                                        <i class="fa-solid fa-eye-slash fa-fw"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Curso, Exp y Electronios -->
                            <div class="row g-4">
                                <!-- Curso -->
                                <div class="col-md-4">
                                    <label for="curso" class="form-label fw-semibold">
                                        <i class="fas fa-graduation-cap me-2"></i>Curso
                                    </label>
                                    <select class="form-select rounded-3" id="curso" name="curso">
                                        <option th:each="curso : ${T(edu.badpals.FigurasOcultas.model.entity.CursoAlumno).values()}"
                                                th:value="${curso.name()}"
                                                th:text="${curso.toString()}"
                                                th:selected="${alumno.curso.name() == curso.name()}">
                                        </option>
                                    </select>
                                </div>

                                <!-- Exp -->
                                <div class="col-md-4">
                                    <label for="exp" class="form-label fw-semibold"><i class="fas fa-bolt me-2"></i>Exp</label>
                                    <input type="number" class="form-control rounded-3" id="exp"
                                           name="tarjetaAlumno.exp" th:value="${alumno.tarjetaAlumno.exp}"
                                           placeholder="Experiencia acumulada"/>
                                </div>

                                <!-- Electronios -->
                                <div class="col-md-4">
                                    <label for="electronios" class="form-label fw-semibold"><i
                                            class="fas fa-coins me-2"></i>Electronios</label>
                                    <input type="number" class="form-control rounded-3" id="electronios"
                                           name="tarjetaAlumno.electronios"
                                           th:value="${alumno.tarjetaAlumno.electronios}" placeholder="Cantidad de electronios"/>
                                </div>
                            </div>
                        </div>

                        <!-- Botones -->
                        <div class="modal-footer px-4 py-3"
                             style="background-color: #e0c3fc; border-bottom-left-radius: 1rem; border-bottom-right-radius: 1rem;">
                            <button type="button" class="btn btn-outline-dark" data-bs-dismiss="modal">
                                <i class="fas fa-times me-1"></i>Cancelar
                            </button>
                            <button type="submit" class="btn" style="background-color: #9b59b6; color: white;">
                                <i class="fas fa-save me-1"></i>Actualizar Alumno
                            </button>
                        </div>
                    </form>

                    <!-- Script toggle password (se mantiene solo para UX) -->
                    <script>
                        document.addEventListener('DOMContentLoaded', () => {
                            const toggle = document.getElementById('togglePasswordEditar');
                            if (toggle) {
                                toggle.addEventListener('click', () => {
                                    const input = document.getElementById("passwordEditar");
                                    const icon = toggle.querySelector("i");
                                    const isPassword = input.type === "password";

                                    input.type = isPassword ? "text" : "password";
                                    icon.classList.toggle("fa-eye-slash");
                                    icon.classList.toggle("fa-eye");
                                });
                            }
                        });
                    </script>

                </div>
            </div>
        </div>
    </div>
</div>
