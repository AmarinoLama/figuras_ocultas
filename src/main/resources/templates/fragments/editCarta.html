<div th:fragment="editCarta">
    <div th:if="${usuario.isAdmin()}">
        <div class="modal fade" id="modalEditarCarta" tabindex="-1" aria-labelledby="modalEditarCartaLabel"
             aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
            <div class="modal-dialog modal-lg modal-dialog-centered modal-editar-carta">
                <div class="modal-content modal-editar-carta-content">
                    <div class="modal-header modal-editar-carta-header">
                        <h4 class="modal-title" id="modalEditarCartaLabel">Editar Carta</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>

                    <form th:action="@{'/cartas/editar/' + ${carta.id}}" method="post" enctype="multipart/form-data" class="modal-editar-carta-form">
                        <div class="modal-body modal-editar-carta-body">

                            <!-- Título -->
                            <div class="mb-3">
                                <label for="titulo" class="form-label">Título</label>
                                <input type="text" class="form-control" id="titulo" name="titulo"
                                       th:value="${carta.titulo}" required />
                            </div>

                            <!-- Descripción -->
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" id="descripcion" rows="3" th:field="*{carta.descripcion}"
                                          required></textarea>
                            </div>

                            <!-- Precio -->
                            <div class="mb-3">
                                <label for="precio" class="form-label">Precio (Electronios)</label>
                                <input type="number" class="form-control" id="precio" min="1" max="100" th:field="*{carta.precio}"
                                       required />
                            </div>

                            <!-- Imagen -->
                            <div class="mb-3">
                                <label for="imagenEditar" class="form-label">Nueva Imagen (opcional)</label>
                                <input type="file" class="form-control" id="imagenEditar" name="imagenFile" accept="image/*" />
                                <small class="text-muted fst-italic">Si quieres conservar la imagen anterior, deja este campo vacío.</small>
                            </div>

                            <!-- Activa -->
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="activa" th:field="*{carta.activa}" />
                                <label class="form-check-label" for="activa">¿Carta activa?</label>
                            </div>

                        </div>

                        <div class="modal-footer modal-editar-carta-footer d-flex justify-content-between">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Actualizar Carta</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
