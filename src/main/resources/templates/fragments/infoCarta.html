<div th:fragment="infoCarta">
    <div th:if="${!usuario.isAdmin()}">
        <div class="modal fade" id="modalInfoCarta" tabindex="-1" aria-labelledby="modalInfoCartaLabel"
             aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">

            <div class="modal-dialog modal-dialog-centered modal-md">
                <div class="modal-content border-0 bg-transparent">

                    <!-- Carta principal -->
                    <div id="carta-especial" class="card mx-auto p-3"
                         style="max-width: 400px;
                                background: linear-gradient(135deg, #3a2b5c, #5e4b8b);
                                border: 3px solid #bba0e3;
                                border-radius: 20px;
                                box-shadow: 0 8px 25px rgba(162,136,227,0.6);
                                color: #f5f5f5;
                                font-family: 'Segoe UI', sans-serif;">

                        <!-- Título de la carta -->
                        <div class="text-center mb-3">
                            <h3 th:text="${carta.titulo}" class="fw-bold text-light"
                                style="text-shadow: 1px 1px 4px rgba(0,0,0,0.6);">
                                Nombre de la Carta
                            </h3>
                        </div>

                        <!-- Imagen de la carta -->
                        <div class="carta-imagen">
                            <img th:src="@{'/cartas/imagen/' + ${carta.id}}" alt="Imagen de la carta">
                        </div>

                        <!-- Descripción de la carta -->
                        <div class="mb-3 mt-5 p-2 descripcion">
                            <h5 class="text-light fw-semibold">Descripción</h5>
                            <p th:text="${carta.descripcion}">Texto de la carta</p>
                        </div>

                        <!-- Precio de la carta -->
                        <div class="mb-3 p-2 d-flex justify-content-between align-items-center precio">
                            <h5 class="text-light mb-0 fw-semibold">Precio</h5>
                            <div class="fs-5 mb-0 d-flex align-items-center gap-1">
                                <strong th:text="${carta.precio}">0</strong>
                                <img src="/images/electronio.png" alt="Electronio" style="width: 30px; height: 30px;">
                            </div>
                        </div>

                        <!-- Botón cerrar -->
                        <div class="text-center mt-3">
                            <button type="button" class="btn btn-outline-light btn-sm px-4" data-bs-dismiss="modal">
                                Cerrar
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
