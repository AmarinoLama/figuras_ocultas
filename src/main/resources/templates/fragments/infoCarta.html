<div th:fragment="infoCarta">
    <div th:if="${!usuario.isAdmin()}">
        <div class="modal fade" id="modalInfoCarta" tabindex="-1" aria-labelledby="modalInfoCartaLabel"
             aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content border-0 bg-transparent">
                    <div class="card mx-auto p-4"
                         style="max-width: 420px; background: linear-gradient(135deg, #3a2b5c, #5e4b8b);
                                border: 4px solid #bba0e3; border-radius: 20px;
                                box-shadow: 0 0 20px #a288e3; color: #f5f5f5; font-family: 'Segoe UI', sans-serif;">

                        <div class="text-center mb-3">
                            <h3 th:text="${carta.titulo}" class="fw-semibold text-light">Nombre de la Carta</h3>
                        </div>

                        <div class="text-center mb-4">
                            <img th:src="@{'/cartas/imagen/' + ${carta.id}}" alt="Imagen de la carta"
                                 class="img-fluid rounded shadow" style="max-height: 220px; border: 2px solid #ddd;">
                        </div>

                        <div class="mb-3">
                            <h5 class="text-light">Descripción</h5>
                            <p th:text="${carta.descripcion}" style="min-height: 60px;">Texto de la carta</p>
                        </div>

                        <div class="mb-3">
                            <h5 class="text-light">Precio</h5>
                            <p class="fs-5"><strong th:text="${carta.precio}">0</strong> electronios</p>
                        </div>

                        <div class="text-center mt-4">
                            <button type="button" class="btn btn-outline-light btn-sm px-4" data-bs-dismiss="modal">Cerrar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
