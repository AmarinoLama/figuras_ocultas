<div th:fragment="navBar">

    <!-- NAVBAR PARA LOS USUARIOS ADMINISTRADORES -->
    <div th:if="${usuario.isAdmin()}">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow p-3 mb-5"
             style="position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background-color: rgba(0, 0, 0, 0.7);">
            <div class="container-fluid d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center position-relative" style="height: 100%;">
                    <p class="navbar-brand fw-bold fs-3 text-gradient mb-0 d-flex align-items-center" style="height: 100%;" th:text="'✨ ' + ${nombreWeb} + ' ✨'"></p>
                    <a th:href="@{/webConfig}"
                       class="position-absolute text-white"
                       style="top: 0; right: 0; font-size: 0.9rem;"
                       title="Configurar web">
                        <i class="fas fa-cog"></i>
                    </a>
                </div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                        aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-3 px-4">
                <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/alumnos}"
                           th:classappend="${currentPath == '/alumnos'} ? 'active'">
                            <i class="fas fa-user-graduate"></i> Alumnado
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/cartas}"
                           th:classappend="${currentPath == '/cartas'} ? 'active'">
                            <i class="fas fa-clone"></i> Cartas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/perfil}"
                           th:classappend="${currentPath == '/perfil'} ? 'active'">
                            <i class="fas fa-user-circle"></i> Perfil
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center ms-3">
                    <span class="navbar-text text-light fw-bold me-2" th:text="'👑 Hola, ' + ${usuario.nombre}"></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-light d-flex justify-content-center align-items-center rounded-circle"
                                style="width: 40px; height: 40px; padding: 0;" title="Cerrar sesión">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </form>
                </div>
            </div>
            </div>
        </nav>
    </div>

    <!-- NAVBAR PARA LOS USUARIOS NORMALES -->
    <div th:if="${!usuario.isAdmin()}">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow p-3 mb-5"
             style="position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; background-color: rgba(0, 0, 0, 0.7);">
        <div class="container-fluid d-flex align-items-center justify-content-between">
            <p class="navbar-brand fw-bold fs-3 text-gradient mb-0 d-flex align-items-center" style="height: 100%;" th:text="'✨ ' + ${nombreWeb} + ' ✨'"></p>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarAlumnos" aria-controls="navbarAlumnos" aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarAlumnos">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-3">
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/cartas}"
                           th:classappend="${currentPath == '/cartas'} ? 'active'">
                            <i class="fas fa-store"></i> Tienda
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/inventario}"
                           th:classappend="${currentPath == '/inventario'} ? 'active'">
                            <i class="fas fa-box-open"></i> Inventario
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/historial}"
                           th:classappend="${currentPath == '/historial'} ? 'active'">
                            <i class="fas fa-history"></i> Historial
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/perfil}"
                           th:classappend="${currentPath == '/perfil'} ? 'active'">
                            <i class="fas fa-user-circle"></i> Perfil
                        </a>
                    </li>

                </ul>

                <div class="d-flex align-items-center ms-3">
                    <span class="navbar-text text-light fw-bold me-2" th:text="'🎮 Bienvenido, ' + ${usuario.nombre}"></span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-light d-flex justify-content-center align-items-center rounded-circle"
                                style="width: 40px; height: 40px; padding: 0;" title="Cerrar sesión">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </form>
                </div>

            </div>
            </div>
        </nav>
    </div>

</div>
