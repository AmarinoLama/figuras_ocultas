<div th:fragment="newAlumno">
    <div th:if="${usuario.isAdmin()}">
        <div class="modal fade" id="modalNuevoAlumno" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">Crear Nuevo Alumno</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{/alumnos/nuevo}" th:object="${nuevoAlumno}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" th:field="${nuevoAlumno.nombre}" class="form-control" id="nombre" required />
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" th:field="${nuevoAlumno.email}" class="form-control" id="email" required />
                            </div>

                            <div class="mb-3">
                                <label for="contrasena" class="form-label">Contraseña</label>
                                <input type="password" th:field="${nuevoAlumno.password}" class="form-control" id="contrasena" required />
                            </div>

                            <div class="mb-3">
                                <label for="curso" class="form-label">Curso</label>
                                <select th:field="${nuevoAlumno.curso}" class="form-select" id="curso" required>
                                    <option th:each="c : ${T(edu.badpals.FigurasOcultas.model.entity.CursoAlumno).values()}"
                                            th:value="${c}"
                                            th:text="${c}">Curso</option>
                                </select>
                            </div>

                            <hr/>

                            <div class="mb-3 d-flex justify-content-between gap-3" id="tarjeta-info-group">
                                <!-- Nivel -->
                                <div class="flex-fill">
                                    <label for="nivel" class="form-label">
                                        <i class="bi bi-graph-up-arrow me-1"></i> Nivel
                                    </label>
                                    <input type="number" th:field="*{tarjetaAlumno.nivel}" class="form-control" id="nivel" min="0" required />
                                </div>

                                <!-- Exp -->
                                <div class="flex-fill">
                                    <label for="exp" class="form-label">
                                        <i class="bi bi-lightning-charge-fill me-1"></i> Exp
                                    </label>
                                    <input type="number" th:field="*{tarjetaAlumno.exp}" class="form-control" id="exp" min="0" required />
                                </div>

                                <!-- Electronios -->
                                <div class="flex-fill">
                                    <label for="electronios" class="form-label">
                                        <i class="bi bi-atom me-1"></i> Electronios
                                    </label>
                                    <input type="number" th:field="*{tarjetaAlumno.electronios}" class="form-control" id="electronios" min="0" required />
                                </div>
                            </div>

                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary">Guardar Alumno</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
