<div th:fragment="newCarta">
    <div th:if="${usuario.isAdmin()}">
        <div class="modal fade" id="modalNuevaCarta" tabindex="-1" aria-labelledby="modalNuevaCartaLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
            <div class="modal-dialog modal-lg modal-dialog-centered">
                <div class="modal-content p-3">
                    <div class="modal-header border-0 pb-0">
                        <h5 class="modal-title fw-bold fs-4" id="modalNuevaCartaLabel">Crear Nueva Carta</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>

                    <form th:action="@{/cartas/nueva}" th:object="${nuevaCarta}" method="post" enctype="multipart/form-data" class="row g-3 needs-validation" novalidate>
                        <div class="modal-body d-flex flex-column flex-lg-row gap-4">
                            <div class="form-section flex-fill">
                                <!-- Título -->
                                <div class="mb-3">
                                    <label for="titulo" class="form-label fw-semibold">Título</label>
                                    <input type="text" class="form-control form-control-lg" id="titulo" th:field="*{titulo}" placeholder="Introduce el título" required />
                                </div>

                                <!-- Descripción -->
                                <div class="mb-3">
                                    <label for="descripcion" class="form-label fw-semibold">Descripción</label>
                                    <textarea class="form-control form-control-lg" id="descripcion" rows="4" th:field="*{descripcion}" placeholder="Introduce la descripción" required></textarea>
                                </div>

                                <!-- Precio -->
                                <div class="mb-3">
                                    <label for="precio" class="form-label fw-semibold">Precio (Electronios)</label>
                                    <input type="number" class="form-control form-control-lg" id="precio" min="1" th:field="*{precio}" placeholder="0" required />
                                </div>

                                <!-- Imagen -->
                                <div class="mb-3">
                                    <label for="imagen" class="form-label fw-semibold">Imagen</label>
                                    <input type="file" class="form-control" id="imagen" name="imagenFile" accept="image/*" required />
                                </div>

                                <!-- Activa -->
                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" id="activa" th:field="*{activa}" />
                                    <label class="form-check-label fw-semibold" for="activa">¿Carta activa?</label>
                                </div>
                            </div>

                            <div class="preview-section flex-fill">
                                <h5 class="card-title fw-bold fs-5" id="previewTitulo">Título</h5>

                                <img id="previewImagen" src="#" alt="Previsualización" style="display:none;" />

                                <p id="previewDescripcion">Descripción</p>

                                <div class="bottom-row">
                                    <p id="previewActiva">Inactiva</p>

                                    <p id="previewPrecio">
                                        <span id="previewPrecioValor">Precio: 0</span>
                                        <img src="/images/electronio.png" alt="Electronio" />
                                    </p>
                                </div>
                            </div>

                        </div>

                        <div class="modal-footer border-0 pt-3 justify-content-between">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary btn-lg">Guardar Carta</button>
                        </div>

                        <script th:if="${showAlert}">
                            alert('El título ya está en uso');
                            var myModal = new bootstrap.Modal(document.getElementById('modalNuevaCarta'), {
                                backdrop: 'static',
                                keyboard: false
                            });
                            myModal.show();
                        </script>

                        <!-- Script de previsualización -->
                        <script>
                            document.getElementById("titulo").addEventListener("input", function () {
                                document.getElementById("previewTitulo").textContent = this.value || "Título";
                            });

                            document.getElementById("descripcion").addEventListener("input", function () {
                                document.getElementById("previewDescripcion").textContent = this.value || "Description";
                            });

                            document.getElementById("precio").addEventListener("input", function () {
                                document.getElementById("previewPrecioValor").textContent = "Precio: " + (this.value || 0);
                            });

                            document.getElementById("activa").addEventListener("change", function () {
                                document.getElementById("previewActiva").textContent = (this.checked ? "Activa" : "Inactiva");
                            });

                            document.getElementById("imagen").addEventListener("change", function (event) {
                                const file = event.target.files[0];
                                const preview = document.getElementById("previewImagen");
                                if (file) {
                                    const reader = new FileReader();
                                    reader.onload = function (e) {
                                        preview.src = e.target.result;
                                        preview.style.display = "block";
                                    };
                                    reader.readAsDataURL(file);
                                } else {
                                    preview.src = "#";
                                    preview.style.display = "none";
                                }
                            });
                        </script>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
