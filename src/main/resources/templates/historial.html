<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Historial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index_style.css?v=1}">
    <link rel="stylesheet" th:href="@{/css/modal_form_style.css?v=1}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div th:insert="~{fragments/navBar :: navBar}" th:with="currentPath='/cartas'"></div>

<div class="container mt-5 pt-4">

    <div th:if="${usuario}">

        <div th:if="${!usuario.isAdmin()}">
            <div class="mb-4 p-3 bg-light rounded shadow-sm text-center"
                 style="font-size: 1.5rem; font-weight: bold; color: #0d6efd;">
                🧾 Historial de Transacciones
            </div>

            <div th:if="${#lists.isEmpty(historial)}" class="alert alert-warning text-center">
                Aún no has comprado cartas.
            </div>

            <div th:if="${!#lists.isEmpty(historial)}" class="table-responsive">
                <table class="table table-bordered mt-4">
                    <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Hora</th>
                        <th>Mensaje</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${historial}">
                        <td th:text="${#dates.format(item.fecha, 'dd/MM/yyyy')}"></td>
                        <td th:text="${#dates.format(item.fecha, 'HH:mm:ss')}"></td>
                        <td>
                                <span th:if="${item.tipo == 'COMPRA'}"
                                      th:text="'Compraste la carta ' + item.titulo + ' por ' + item.precio + ' electronios'">
                                </span>
                            <span th:if="${item.tipo == 'USO'}"
                                  th:text="'Usaste la carta ' + item.titulo">
                                </span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</div>

</body>
</html>
