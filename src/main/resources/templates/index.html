<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Figuras Ocultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login_style.css?v=1}">
</head>

<body>
  <p>HOLA MUNDO</p>
  <div style="display: inline-block; float: right;" th:if="${usuario}">
      <div th:if="${usuario.isAdmin()}">
          <p>El usuario que se ha logueado es admin</p>

          <div class="container mt-4" id="content" style="margin-bottom: 20px">
              <div class="row row-cols-md-3 g-4">
                  <div class="col" th:each="alumno : ${alumnos}">
                      <div class="card p-3">
                          <p class="card-title" th:text="${alumno.nombre}"></p>
                          <p class="card-text" th:text="${alumno.email}"></p>
                      </div>
                  </div>
              </div>
          </div>

      </div>
      <div th:if="${!usuario.isAdmin()}">
          <p>Bienvenido alumno!</p>
      </div>
  </div>
</body>
</html>
