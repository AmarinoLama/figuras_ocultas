<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Plantilla</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index_style.css?v=1}">
    <link rel="stylesheet" th:href="@{/css/modal_form_style.css?v=1}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<div th:insert="~{fragments/navBar :: navBar}" th:with="currentPath='/alumnado'"></div>

<body class="pt-5">

<div class="container mt-5 pt-4">
    <div th:if="${usuario}">
        <div th:if="${usuario.isAdmin()}">

            <div class="mb-4 p-3 bg-light rounded shadow-sm text-center" style="font-size: 1.5rem; font-weight: bold; color: #6f42c1;">
                <div th:text="${alumno.nombre} + ' - ' + ${alumno.curso}"></div>
            </div>

            <div class="card shadow rounded-4 p-4">
                <div class="row">

                    <!-- Insignias obtenidas -->
                    <div class="col-md-5">
                        <h5 class="fw-bold mb-3">🎖️ Insignias obtenidas:</h5>
                        <ul class="list-group list-group-flush border rounded-3 shadow-sm overflow-auto" style="max-height: 280px;">
<!--                            <li class="list-group-item d-flex align-items-center border-0"-->
<!--                                th:each="insignia : ${alumno.insignias}">-->
<!--                                <i class="fas fa-medal text-warning me-2 fs-5"></i>-->
<!--                                <span th:text="${insignia.nombre}">Nombre Insignia</span>-->
<!--                            </li>-->
<!--                            <li class="list-group-item text-muted text-center" th:if="${#lists.isEmpty(alumno.insignias)}">-->
<!--                                No hay insignias aún-->
<!--                            </li>-->
                        </ul>
                    </div>

                    <!-- Separador -->
                    <div class="col-md-1 d-flex justify-content-center align-items-center">
                        <div style="width: 2px; height: 80%; background-color: #ccc;"></div>
                    </div>

                    <!-- Formulario de asignación -->
                    <div class="col-md-6">
                        <h5 class="fw-bold mb-3">➕ Asignar nueva insignia</h5>
                        <form th:action="@{/insignias/asignar}" method="post" enctype="multipart/form-data">
                            <input type="hidden" name="alumnoId" th:value="${usuario.id}"/>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">🏷️ Nombre de la insignia</label>
                                <input type="text" class="form-control rounded-3 shadow-sm" name="nombre" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">🖼️ Imagen de la insignia</label>
                                <input type="file" class="form-control rounded-3 shadow-sm" name="imagen" accept="image/*" required>
                            </div>

                            <div class="text-end mt-4">
                                <button type="submit" class="btn btn-success rounded-3 px-4 shadow-sm">
                                    <i class="fas fa-plus-circle me-1"></i> Asignar
                                </button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
