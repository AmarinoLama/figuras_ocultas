<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${nombreWeb}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index_style.css?v=1}">
    <link rel="stylesheet" th:href="@{/css/insignias.css?v=1}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<div th:insert="~{fragments/navBar :: navBar}" th:with="currentPath='/alumnado'"></div>

<body style="padding-top: 8rem;">
<div class="container-fluid mt-5 pt-4">

    <div th:if="${usuario}">
        <div th:if="${usuario.isAdmin()}">

            <!-- Contenedor para el título con el mismo max-width y margin que abajo -->
            <div class="mb-4 d-flex align-items-center justify-content-start gap-3" style="height: 56px; max-width: 1600px; margin: 0 auto;">
                <a href="/alumnos" class="btn btn-square shadow-sm d-flex align-items-center px-0 py-0">
                    <i class="fas fa-arrow-left fs-5"></i>
                </a>

                <div class="flex-grow-1 text-center p-3 bg-light rounded shadow-sm"
                     style="font-size: 1.5rem; font-weight: bold; color: #6f42c1; line-height: 1.3;">
                    <div th:text="${alumno.nombre} + ' - ' + ${alumno.curso}"></div>
                </div>
            </div>

            <!-- Card contenedor principal, centrado y con max-width -->
            <div class="card shadow rounded-4 p-4 w-100" style="max-width: 1600px; margin: 0 auto; height: 60vh;">

            <!-- Fila con los 3 bloques, usando gap para separar -->
                <div class="row gy-5 gx-4 align-items-stretch">

                <!-- Insignias obtenidas -->
                    <section class="col-md-4 d-flex flex-column me-3">
                        <h5 class="fw-bold mb-3">🎖️ Insignias obtenidas:</h5>
                        <ul class="list-group list-group-flush border rounded-3 shadow-sm overflow-auto flex-grow-1" style="max-height: 280px;">
                            <li class="list-group-item d-flex align-items-center border-0"
                                th:each="nivel : ${alumno.tarjetaAlumno.getNivel() > 0} ? ${#numbers.sequence(1, alumno.tarjetaAlumno.getNivel())} : ${null}">
                                <i class="fas fa-rocket text-primary me-2 fs-5" th:if="${nivel == 1}"></i>
                                <i class="fas fa-compass text-info me-2 fs-5" th:if="${nivel == 2}"></i>
                                <i class="fas fa-book-open text-success me-2 fs-5" th:if="${nivel == 3}"></i>
                                <i class="fas fa-cogs text-secondary me-2 fs-5" th:if="${nivel == 4}"></i>
                                <i class="fas fa-star-half-alt text-warning me-2 fs-5" th:if="${nivel == 5}"></i>
                                <i class="fas fa-crown text-warning me-2 fs-5" th:if="${nivel == 6}"></i>
                                <span th:switch="${nivel}">
                                    <span th:case="1">Estudante de grado</span>
                                    <span th:case="2">Estudante de máster</span>
                                    <span th:case="3">Estudante de doutorado</span>
                                    <span th:case="4">Investigad@r en prácticas</span>
                                    <span th:case="5">Responsable grupo de invesigación</span>
                                    <span th:case="6">Investigad@r xef@</span>
                                </span>
                            </li>
                            <li class="list-group-item d-flex align-items-center border-0"
                                th:each="insignia : ${alumno.insignias}">
                                <i class="fas fa-medal text-warning me-2 fs-5"></i>
                                <span th:text="${insignia.nombre}">Nombre Insignia</span>
                            </li>
                            <li class="list-group-item text-muted text-center"
                                th:if="${#lists.isEmpty(alumno.insignias) and alumno.tarjetaAlumno.getNivel() == 0}">
                                No hay insignias aún
                            </li>
                        </ul>
                    </section>

                    <!-- Formulario -->
                    <section class="col-md-4 d-flex flex-column me-5 ms-5">
                        <h5 class="fw-bold mb-3">➕ Asignar nueva insignia</h5>
                        <form id="formInsignia" th:action="@{/insignias/asignar}" method="post" enctype="multipart/form-data" class="mb-4">
                            <input type="hidden" name="alumnoId" th:value="${usuario.id}"/>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">🏷️ Nombre de la insignia</label>
                                <input type="text" id="nombreInsigniaInput" class="form-control rounded-3 shadow-sm" name="nombre" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">🖼️ Imagen de la insignia</label>
                                <input id="inputImagen" type="file" class="form-control rounded-3 shadow-sm" name="imagen" accept="image/*" required>
                            </div>

                            <div class="text-end mt-4">
                                <button type="submit" class="btn btn-success rounded-3 px-4 shadow-sm">
                                    <i class="fas fa-plus-circle me-1"></i> Asignar
                                </button>
                            </div>
                        </form>
                    </section>

                    <!-- Previsualización -->
                    <section class="col-md-2 d-flex flex-column align-items-center ms-5">
                    <h6 class="fw-semibold mb-3 text-center">👁️ Previsualización</h6>
                        <div id="previewContainer"
                             style="width: 160px; height: 160px; border-radius: 50%; background-color: #ddd; display: flex; justify-content: center; align-items: center; overflow: hidden; border: 3px solid #6f42c1;">
                            <i id="previewIcon" class="fas fa-image text-secondary fs-1"></i>
                            <img id="previewImage" src="" alt="Previsualización insignia"
                                 style="display: none; width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
                        </div>
                        <div id="previewNombre" class="mt-3 fw-semibold text-secondary text-center" style="font-size: 1rem;">
                            (sin nombre)
                        </div>
                    </section>

                </div>
            </div>

            <script>
                const inputImagen = document.getElementById('inputImagen');
                const previewImage = document.getElementById('previewImage');
                const previewIcon = document.getElementById('previewIcon');
                const nombreInput = document.getElementById('nombreInsigniaInput');
                const previewNombre = document.getElementById('previewNombre');

                inputImagen.addEventListener('change', () => {
                    const file = inputImagen.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = e => {
                            previewImage.src = e.target.result;
                            previewImage.style.display = 'block';
                            previewIcon.style.display = 'none';
                        };
                        reader.readAsDataURL(file);
                    } else {
                        previewImage.src = '';
                        previewImage.style.display = 'none';
                        previewIcon.style.display = 'block';
                    }
                });

                nombreInput.addEventListener('input', () => {
                    previewNombre.textContent = nombreInput.value || '(sin nombre)';
                });
            </script>
        </div>
    </div>
</div>
</body>
</html>
