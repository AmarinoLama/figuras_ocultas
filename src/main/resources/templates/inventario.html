<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${nombreWeb}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index_style.css?v=1}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="pt-5">

<div th:insert="~{fragments/navBar :: navBar}" th:with="currentPath='/cartas'"></div>

<div class="container mt-5 pt-4">

    <div th:if="${usuario}">

        <div th:if="${mensajeUso}" class="alert alert-dismissible fade show mt-3"
             th:classappend="'alert-' + ${tipoAlerta}" role="alert">
            <span th:text="${mensajeUso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

        <div th:if="${!usuario.isAdmin()}">
            <div class="mb-4 p-3 bg-light rounded shadow-sm text-center" style="font-size: 1.5rem; font-weight: bold; color: #0d6efd;">
                🧠 Tus Cartas en el Inventario
            </div>

            <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
                <div th:each="carta : ${cartas}" class="col">
                    <div class="card text-dark border-0 shadow-sm"
                         style="background-color: #ffd580; border-radius: 20px; position: relative; overflow: hidden;">

                        <!-- Título -->
                        <div class="d-flex justify-content-between align-items-start p-3">
                            <h5 class="card-title fw-bold mb-0"
                                th:text="${carta.titulo}"
                                style="font-size: 1.2rem; line-height: 1.2; max-width: 70%; word-wrap: break-word; white-space: normal;">
                                Nombre de la carta
                            </h5>
                        </div>

                        <!-- Imagen -->
                        <div class="d-flex justify-content-center p-3 pt-0">
                            <img th:src="@{'/cartas/imagen/' + ${carta.id}}"
                                 class="img-fluid rounded border border-3"
                                 style="max-height: 160px; border-color: #ffc107;"
                                 alt="Imagen de la carta">
                        </div>

                        <!-- Botones -->
                        <div class="d-flex justify-content-between align-items-center px-3 pb-3">
                            <div class="d-flex gap-2">
                                <form th:action="@{'/inventario/usar/' + ${carta.id}}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm btn-light fw-bold"
                                            onclick="return confirm('¿Quieres usar esta carta?');"
                                            title="Usar carta">🎮</button>
                                </form>

                                <button class="btn btn-sm btn-outline-dark btn-info-carta fw-bold"
                                        th:data-id="${carta.id}" title="Info">
                                    ℹ️
                                </button>
                            </div>

                            <div class="bg-light text-dark rounded px-2 py-1 d-flex align-items-center"
                                 style="font-weight: bold; font-size: 1rem; box-shadow: 0 0 6px rgba(0,0,0,0.1); user-select: none;">
                                🎒 <span th:text="${inventario[carta.id]} ?: 0">0</span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

            <div th:if="${#lists.isEmpty(cartas)}" class="alert alert-warning text-center mt-4">
                Aún no has comprado cartas
            </div>

        </div>

    </div>

</div>

<!-- Contenedor del modal de info -->
<div id="modalContainerInfo"></div>

<!-- Script para cargar info de carta -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const botones = document.querySelectorAll(".btn-info-carta");
        const container = document.querySelector("#modalContainerInfo");

        botones.forEach(btn => {
            btn.addEventListener("click", async () => {
                const id = btn.getAttribute("data-id");

                const response = await fetch(`/cartas/info?id=${encodeURIComponent(id)}`);
                const html = await response.text();

                container.innerHTML = html;

                const modal = new bootstrap.Modal(document.getElementById('modalInfoCarta'));
                modal.show();
            });
        });
    });
</script>

</body>
</html>
