<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${nombreWeb}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index_style.css?v=1}">
    <link rel="stylesheet" th:href="@{/css/inventario_style.css?v=2}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="pt-5">

<div th:insert="~{fragments/navBar :: navBar}" th:with="currentPath='/cartas'"></div>
<div th:insert="~{modalesAvisos/usarCarta :: modalConfirmarUsoCarta}"></div>

<div class="container mt-5 pt-4">

    <div th:if="${usuario}">

        <div th:if="${mensajeUso}" class="alert alert-dismissible fade show mt-3"
             th:classappend="'alert-' + ${tipoAlerta}" role="alert">
            <span th:text="${mensajeUso}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

        <div th:if="${!usuario.isAdmin()}">

            <div class="mb-4 p-3 bg-light rounded shadow-sm text-center"
                 style="font-size: 1.5rem; font-weight: bold; color: #0d6efd;">
                🧠 Tus Cartas en el Inventario
            </div>

            <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4">
                <div th:each="carta : ${cartas}" class="col">
                    <div class="card shadow-sm p-0">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${carta.titulo}">Título</h5>
                            <img th:src="@{'/cartas/imagen/' + ${carta.id}}"
                                 class="card-img-top"
                                 alt="Imagen de la carta"
                                 loading="lazy">
                            <p class="card-text d-flex justify-content-between align-items-center">
                                <span class="badge bg-primary">
                                    🎒 <span th:text="${inventario[carta.id]} ?: 0">0</span>
                                </span>
                            </p>
                        </div>
                        <div class="card-footer d-flex justify-content-between">
                            <button type="button" class="btn btn-success btn-sm fw-bold btn-abrir-modal-uso"
                                    th:attr="data-id=${carta.id}, data-nombre=${carta.titulo}">
                                🎮
                            </button>
                            <button class="btn btn-info btn-sm btn-info-carta fw-bold"
                                    th:data-id="${carta.id}" title="Info">
                                ℹ️
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(cartas)}" class="alert alert-warning text-center mt-4">
                Aún no has comprado cartas
            </div>

        </div>

    </div>

</div>

<!-- Contenedor del modal de info -->
<div id="modalContainerInfo"></div>

<!-- Script para cargar info de carta -->
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const botones = document.querySelectorAll(".btn-info-carta");
        const container = document.querySelector("#modalContainerInfo");

        botones.forEach(btn => {
            btn.addEventListener("click", async () => {
                const id = btn.getAttribute("data-id");

                const response = await fetch(`/cartas/info?id=${encodeURIComponent(id)}`);
                const html = await response.text();

                container.innerHTML = html;

                const modal = new bootstrap.Modal(document.getElementById('modalInfoCarta'));
                modal.show();
            });
        });
    });
</script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const modalUso = document.getElementById('modalConfirmarUsoCarta');
        const nombreCartaSpan = modalUso.querySelector('#nombreCartaAUsar');
        const formUsarCarta = modalUso.querySelector('#formUsarCarta');

        document.querySelectorAll('.btn-abrir-modal-uso').forEach(btn => {
            btn.addEventListener('click', () => {
                const idCarta = btn.getAttribute('data-id');
                const nombreCarta = btn.getAttribute('data-nombre');

                nombreCartaSpan.textContent = nombreCarta;
                formUsarCarta.setAttribute('action', `/inventario/usar/${idCarta}`);

                const modal = new bootstrap.Modal(modalUso);
                modal.show();
            });
        });
    });

</script>

</body>
</html>
