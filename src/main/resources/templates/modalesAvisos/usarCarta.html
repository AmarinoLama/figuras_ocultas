<div th:fragment="modalConfirmarUsoCarta">
    <div class="modal fade" id="modalConfirmarUsoCarta" tabindex="-1" aria-labelledby="modalUsoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow-lg">
                <!-- Cabecera azul -->
                <div class="modal-header bg-primary text-white rounded-top">
                    <h5 class="modal-title" id="modalUsoLabel">
                        <i class="fas fa-hand-paper me-2"></i>Confirmar uso
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body text-dark">
                    <p>¿Estás seguro de que quieres usar la carta <strong id="nombreCartaAUsar"></strong>?</p>
                </div>

                <div class="modal-footer">
                    <form id="formUsarCarta" method="post">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <!-- Botón usar azul -->
                        <button type="submit" class="btn btn-primary fw-bold">Sí, usar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
