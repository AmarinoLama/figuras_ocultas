<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index_style.css?v=1}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .toggle-container {
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .toggle-container:hover {
            color: #6f42c1; /* morado pastel bonito */
        }

        /* 🎯 Clase para fijar tamaño del botón del ojito */
        .btn-ojo-fijo {
            width: 40px;
            height: 40px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

<div th:insert="~{fragments/navBar :: navBar}" th:with="currentPath='/cartas'"></div>

<div class="container mt-5 pt-4">
    <div th:if="${usuario}">
        <div th:if="${usuario.isAdmin()}">
            <div class="container mt-5 pt-4">
                <h2 class="mb-4 text-center fw-bold" style="color: #ffffff;">👤 Mi Perfil</h2>

                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6">
                        <div class="card border-0 shadow-sm p-4 rounded-4" style="background-color: #f3e8ff;">
                            <form th:action="@{/perfil/actualizar}" method="post">

                                <div class="mb-3">
                                    <label for="nombre" class="form-label fw-bold">Nombre</label>
                                    <input type="text" class="form-control rounded-3" id="nombre" name="nombre" th:value="${usuario.nombre}" required>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label fw-bold">Email</label>
                                    <input type="email" class="form-control rounded-3" id="email" name="email" th:value="${usuario.email}" required>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label fw-bold">Contraseña</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control rounded-start-3" id="password" name="password" placeholder="••••••" required>
                                        <span class="input-group-text bg-white border-start-0 toggle-container btn-ojo-fijo"
                                              onclick="togglePassword('password', this)" title="Mostrar/Ocultar contraseña">
                                            <i class="fa-solid fa-eye-slash"></i>
                                        </span>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Rol</label>
                                    <input type="text" class="form-control rounded-3" th:value="${usuario.rol}" readonly disabled>
                                </div>

                                <div th:if="${!usuario.isAdmin()}">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold">Curso</label>
                                        <input type="text" class="form-control rounded-3" th:value="${usuario.curso}" readonly disabled>
                                    </div>

                                    <div class="mb-3 bg-light p-3 rounded-3 shadow-sm">
                                        <h5 class="fw-bold">🎮 Tarjeta Alumno</h5>
                                        <p><strong>Nivel:</strong> <span th:text="${usuario.tarjetaAlumno.nivel}">0</span></p>
                                        <p><strong>Experiencia:</strong> <span th:text="${usuario.tarjetaAlumno.exp}">0</span></p>
                                        <p><strong>Electronios:</strong> ⚡ <span th:text="${usuario.tarjetaAlumno.electronios}">0</span></p>
                                    </div>
                                </div>

                                <div class="d-flex justify-content-between align-items-center mt-3">
                                    <div th:if="${successMessage}" class="text-success fw-bold me-auto">
                                        ✅ <span th:text="${successMessage}"></span>
                                    </div>
                                    <button type="submit" class="btn btn-primary fw-bold rounded-3 ms-auto">
                                        💾 Guardar Cambios
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Script para alternar visibilidad de contraseña -->
<script>
    function togglePassword(inputId, toggleElement) {
        const input = document.getElementById(inputId);
        const icon = toggleElement.querySelector("i");

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        }
    }
</script>

</body>
</html>
