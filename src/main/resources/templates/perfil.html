<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${nombreWeb}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index_style.css?v=1}">
    <link rel="stylesheet" th:href="@{/css/perfil_style.css?v=2}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="pt-5">

<div th:insert="~{fragments/navBar :: navBar}" th:with="currentPath='/cartas'"></div>

<div class="container mt-5 pt-4">
    <div th:if="${usuario}">

        <!-- VISUALIZACIÓN DE ADMINISTRADOR -->

        <div th:if="${usuario.isAdmin()}">
            <div class="container mt-5 pt-4">
                <h2 class="mb-4 text-center fw-bold" style="color: #ffffff;">👤 Mi Perfil</h2>

                <div class="row justify-content-center">
                    <div class="col-md-8 col-lg-6">
                        <div class="card border-0 shadow-sm p-4 rounded-4" style="background-color: #f3e8ff;">
                            <form th:action="@{/perfil/actualizar}" method="post">

                                <div class="mb-3">
                                    <label for="nombre" class="form-label fw-bold">Nombre</label>
                                    <input type="text" class="form-control rounded-3" id="nombreAdmin" name="nombre" th:value="${usuario.nombre}" required>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label fw-bold">Email</label>
                                    <input type="email" class="form-control rounded-3" id="emailAdmin" name="email" th:value="${usuario.email}" required>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label fw-bold">Contraseña</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control rounded-start-3" id="passwordAdmin" name="password" placeholder="••••••" required>
                                        <span class="input-group-text bg-white border-start-0 toggle-container btn-ojo-fijo"
                                              onclick="togglePassword('passwordAdmin', this)" title="Mostrar/Ocultar contraseña">
                                            <i class="fa-solid fa-eye-slash"></i>
                                        </span>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Rol</label>
                                    <input type="text" class="form-control rounded-3" th:value="${usuario.rol}" readonly disabled>
                                </div>

                                <div class="d-flex justify-content-between align-items-center mt-3">
                                    <div th:if="${successMessage}" class="text-success fw-bold me-auto">
                                        ✅ <span th:text="${successMessage}"></span>
                                    </div>
                                    <div th:if="${errorMessage}" class="text-danger fw-bold">
                                        ❌ <span th:text="${errorMessage}"></span>
                                    </div>
                                    <button type="submit" class="btn btn-primary fw-bold rounded-3 ms-auto">
                                        💾 Guardar Cambios
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- VISUALIZACIÓN PARA LOS ALUMNOS -->

        <div th:if="${!usuario.isAdmin()}">

            <h2 class="mb-4 text-center fw-bold" style="color: #ffffff;">👤 Mi Perfil</h2>

            <div class="container">
                <div class="row g-4">

                    <!-- IZQUIERDA: Tarjeta alumno -->
                    <div class="col-md-3">
                        <div class="bg-white p-4 rounded-4 shadow-lg border border-secondary-subtle" style="color: #222222; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
                            <h5 class="fw-bold mb-4 text-center" style="color: #111111; letter-spacing: 1px;">🎮 Tarjeta Alumno</h5>
                            <p class="mb-3 fs-6"><strong style="color: #333333;">Nivel:</strong> <span th:text="${usuario.tarjetaAlumno.nivel}">0</span></p>
                            <p class="mb-3 fs-6"><strong style="color: #333333;">Experiencia:</strong> <span th:text="${usuario.tarjetaAlumno.exp}">0</span></p>
                            <p class="mb-0 fs-6"><strong style="color: #333333;">Electronios:</strong> <span th:text="${usuario.tarjetaAlumno.electronios}">0</span> <img src="/images/electronio.png" alt="Electronio" style="width: 20px; height: 20px;"></p>
                        </div>
                    </div>

                    <!-- CENTRO: Formulario -->
                    <div class="col-md-6">
                        <div class="card border-0 shadow-sm p-4 rounded-4" style="background-color: #f3e8ff;">
                            <form th:action="@{/perfil/actualizar}" method="post">

                                <div class="mb-3">
                                    <label for="nombre" class="form-label fw-bold">Nombre</label>
                                    <input type="text" class="form-control rounded-3" id="nombre" name="nombre" th:value="${usuario.nombre}" readonly>
                                </div>

                                <div class="mb-3">
                                    <label for="email" class="form-label fw-bold">Email</label>
                                    <input type="email" class="form-control rounded-3" id="email" name="email" th:value="${usuario.email}" readonly>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label fw-bold">Contraseña</label>
                                    <div class="input-group">
                                        <input type="password" class="form-control rounded-start-3" id="password" name="password" placeholde="••••••">
                                        <span class="input-group-text bg-white border-start-0 toggle-container btn-ojo-fijo"
                                              onclick="togglePassword('password', this)" title="Mostrar/Ocultar contraseña">
                                        <i class="fa-solid fa-eye-slash"></i>
                                    </span>
                                    </div>
                                    <small class="text-muted">Deja vacío para no cambiar la contraseña</small>
                                </div>

                                <div class="mb-3">
                                    <label for="curso" class="form-label fw-bold">Curso</label>
                                    <input type="text" class="form-control rounded-3" id="curso" name="curso" th:value="${usuario.curso}" readonly disabled>
                                </div>

                                <div class="d-flex justify-content-between align-items-center mt-3">
                                    <div th:if="${successMessage}" class="text-success fw-bold">
                                        ✅ <span th:text="${successMessage}"></span>
                                    </div>
                                    <div th:if="${errorMessage}" class="text-danger fw-bold">
                                        ❌ <span th:text="${errorMessage}"></span>
                                    </div>
                                    <button type="submit" class="btn btn-primary fw-bold rounded-3 ms-auto">
                                        💾 Guardar Cambios
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>

                    <!-- DERECHA: Insignias -->
                    <div class="col-md-3">
                        <h5 class="fw-bold mb-3 text-white text-center">🏅 Mis Insignias</h5>

                        <div class="row row-cols-3 g-3 justify-content-center">

                            <!-- Insignias de nivel hardcodeadas -->
                            <div class="col text-center"
                                 th:each="lvl : ${#numbers.sequence(1,6)}"
                                 th:if="${usuario.tarjetaAlumno.nivel >= lvl}">
                                <div class="badge-level mx-auto"
                                     th:classappend="' lvl-' + ${lvl}">
                                    <span th:text="${lvl}"></span>
                                </div>
                                <div th:if="${lvl == 1}" class="mt-1 text-white fw-semibold">Cerebro lógico</div>
                                <div th:if="${lvl == 2}" class="mt-1 text-white fw-semibold">Maestría en medidas</div>
                                <div th:if="${lvl == 3}" class="mt-1 text-white fw-semibold">Investigador científico</div>
                                <div th:if="${lvl == 4}" class="mt-1 text-white fw-semibold">Leyenda científica</div>
                                <div th:if="${lvl == 5}" class="mt-1 text-white fw-semibold">Mente brillante</div>
                                <div th:if="${lvl == 6}" class="mt-1 text-white fw-semibold">Insignia Curie</div>
                            </div>

                            <!-- Insignias de BBDD -->
                            <div class="col text-center" th:each="insignia : ${insigniasAlumno}">
                                <div class="badge-level mx-auto"
                                     style="radial-gradient(circle at 30% 30%, #e5e7eb, #6b7280 70%);">
                                    <img th:src="@{'/alumnos/insignias/imagen/' + ${insignia.id}}"
                                         alt="Imagen de la insignia"
                                         style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                                </div>
                                <div class="mt-1 text-white fw-semibold" th:text="${insignia.nombre}"></div>
                            </div>

                            <!-- Mensaje si no hay insignias -->
                            <div th:if="${#lists.isEmpty(usuario.insignias) && usuario.tarjetaAlumno.nivel == 0}"
                                 class="col-12 text-center text-white">
                                No tienes insignias aún.
                            </div>

                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- Script para alternar visibilidad de contraseña -->
<script>
    function togglePassword(inputId, toggleElement) {
        const input = document.getElementById(inputId);
        const icon = toggleElement.querySelector("i");

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        }
    }
</script>

</body>
</html>
