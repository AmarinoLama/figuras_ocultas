<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${nombreWeb}">Nombre Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index_style.css?v=1}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            color: #000 !important; /* Forzar letra negra */
            background-color: #f8f9fa; /* fondo suave */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .container-centered {
            background: #fff;
            padding: 3rem 4rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
        }
        .titulo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.9rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 2rem; /* espacio abajo */
        }
        form#formName {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 2.5rem; /* espacio abajo para separar de botones */
        }
        label {
            font-weight: 600;
            font-size: 1.1rem;
            color: #34495e;
        }
        input.form-control {
            width: 100%;
            font-size: 1.1rem;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            border: 1.8px solid #ced4da;
            transition: border-color 0.3s ease;
        }
        input.form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 8px rgba(13, 110, 253, 0.3);
        }
        /* Botones específicos para esta página */
        #btnGroup {
            width: 100%;
            display: flex;
            justify-content: center; /* centrar horizontal */
            gap: 2rem; /* espacio entre botones */
        }
        #btnVolver, #btnGuardar {
            min-width: 140px;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.5rem 1.2rem;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div th:insert="~{fragments/navBar :: navBar}" th:with="currentPath='/alumnado'"></div>

<div class="container-centered">

    <div th:if="${usuario}">
        <div th:if="${usuario.isAdmin()}">

            <div class="titulo">
                <i class="fas fa-globe fa-lg" style="color:#0d6efd;"></i>
                <span>Editar nombre de la web</span>
            </div>

            <form id="formName" th:action="@{/webConfig/changeName}" method="post" th:object="${webConfigForm}">
                <label for="nombre">Nuevo nombre:</label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-control" required autofocus>
            </form>

            <div id="btnGroup">
                <a id="btnVolver" href="/alumnos" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-2"></i> Volver a alumnos
                </a>
                <button id="btnGuardar" type="submit" form="formName" class="btn btn-primary" title="Guardar nuevo nombre">
                    <i class="fas fa-save me-2"></i> Guardar
                </button>
            </div>

        </div>
    </div>

</div>

</body>
</html>
